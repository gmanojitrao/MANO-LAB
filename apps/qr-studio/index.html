<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Studio — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fast lightweight QR Code library -->
  <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090a0d;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .container {
      max-width: 860px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2.5rem;
      align-items: center;
    }
    @media (max-width: 768px) { .container { grid-template-columns: 1fr; margin: 1.5rem auto; } }
    .panel {
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .preview-panel {
      align-items: center;
      justify-content: center;
      text-align: center;
    }
    .qr-canvas-box {
      padding: 1.5rem;
      background: #fff;
      border-radius: 18px;
      display: inline-block;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      margin-bottom: 1.5rem;
    }
    .input-field {
      width: 100%;
      padding: 0.75rem 1rem;
      background: #181b24;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #fff;
      font-family: inherit;
      font-size: 0.95rem;
      outline: none;
    }
    .input-field:focus { border-color: #c8ff00; }
    .color-swatches {
      display: flex;
      gap: 0.6rem;
    }
    .swatch {
      width: 2.2rem;
      height: 2.2rem;
      border-radius: 50%;
      border: 2px solid transparent;
      cursor: pointer;
      transition: transform 0.15s;
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch.active { border-color: #fff; }
    .btn-download {
      padding: 0.85rem;
      background: #c8ff00;
      color: #08090c;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      font-size: 0.95rem;
      transition: all 0.15s;
    }
    .btn-download:hover { background: #d8ff33; transform: scale(1.02); }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">📱</span>
      <span>QR Studio — Fast Vector QR Code Creator</span>
    </div>
    <div style="font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace;">Instant PNG Export</div>
  </header>

  <div class="container">
    <!-- Controls -->
    <div class="panel">
      <div>
        <label style="font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: #7a8294; text-transform: uppercase; display: block; margin-bottom: 0.5rem;">
          URL or Text Content
        </label>
        <input type="text" id="qrText" class="input-field" value="https://mano-lab.pages.dev" placeholder="Enter link or text..." oninput="generateQR()">
      </div>

      <div>
        <label style="font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; color: #7a8294; text-transform: uppercase; display: block; margin-bottom: 0.6rem;">
          Foreground Color
        </label>
        <div class="color-swatches">
          <div class="swatch active" style="background: #090a0d;" onclick="setColor('#090a0d', this)"></div>
          <div class="swatch" style="background: #4f46e5;" onclick="setColor('#4f46e5', this)"></div>
          <div class="swatch" style="background: #059669;" onclick="setColor('#059669', this)"></div>
          <div class="swatch" style="background: #e11d48;" onclick="setColor('#e11d48', this)"></div>
          <div class="swatch" style="background: #7c3aed;" onclick="setColor('#7c3aed', this)"></div>
        </div>
      </div>
    </div>

    <!-- Preview -->
    <div class="panel preview-panel">
      <div class="qr-canvas-box" id="qrBox">
        <div id="qrcode"></div>
      </div>
      <button class="btn-download" onclick="downloadQR()">
        <i data-lucide="download" style="width: 16px; height: 16px;"></i>
        <span>Download QR Code</span>
      </button>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    let qrColor = '#090a0d';
    let qrcodeObj = null;

    function generateQR() {
      const container = document.getElementById('qrcode');
      container.innerHTML = '';
      const text = document.getElementById('qrText').value.trim() || 'https://mano-lab.pages.dev';

      qrcodeObj = new QRCode(container, {
        text: text,
        width: 180,
        height: 180,
        colorDark: qrColor,
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function setColor(hex, el) {
      qrColor = hex;
      document.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      generateQR();
    }

    function downloadQR() {
      const img = document.querySelector('#qrcode img');
      if (img && img.src) {
        const a = document.createElement('a');
        a.href = img.src;
        a.download = 'mano-lab-qr.png';
        a.click();
      }
    }

    window.addEventListener('load', generateQR);
  </script>
</body>
</html>
