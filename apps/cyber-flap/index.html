<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Flap — MANO-LAB Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #08090c;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: none;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .game-container {
      max-width: 440px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0.75rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .score-item { display: flex; flex-direction: column; }
    .score-lbl { font-size: 0.7rem; color: #7a8294; text-transform: uppercase; }
    .score-val { font-size: 1.4rem; font-weight: 800; color: #c8ff00; }
    .canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      border: 2px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 40px rgba(200, 255, 0, 0.05);
      background: #090a0f;
    }
    canvas {
      display: block;
      width: 100%;
      height: 480px;
      background: #090a0f;
      cursor: pointer;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(8, 9, 12, 0.88);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1.25rem;
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title {
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -0.02em;
    }
    .btn-action {
      background: #c8ff00;
      color: #000;
      font-weight: 800;
      font-size: 1rem;
      padding: 0.85rem 2rem;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s, box-shadow 0.15s;
    }
    .btn-action:hover {
      transform: scale(1.04);
      box-shadow: 0 0 24px rgba(200, 255, 0, 0.4);
    }
    .hint-bar {
      font-size: 0.8rem;
      color: #7a8294;
      text-align: center;
    }
    .hint-kbd {
      background: #1e222c;
      padding: 0.2rem 0.5rem;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      font-family: 'JetBrains Mono', monospace;
      color: #f5f5f0;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">🚀</span>
      <span>CYBER FLAP</span>
    </div>
    <div style="width: 80px;"></div>
  </header>

  <div class="game-container">
    <div class="scoreboard">
      <div class="score-item">
        <span class="score-lbl">Score</span>
        <span id="scoreVal" class="score-val">0</span>
      </div>
      <div class="score-item" style="align-items: flex-end;">
        <span class="score-lbl">Best Score</span>
        <span id="bestVal" class="score-val" style="color: #38bdf8;">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="400" height="480"></canvas>

      <!-- Start Overlay -->
      <div id="startOverlay" class="overlay">
        <div style="font-size: 3rem;">🚀</div>
        <div class="overlay-title">CYBER FLAP</div>
        <p style="color: #9aa0a6; font-size: 0.9rem; max-width: 280px;">
          Tap screen or press Space to fly through neon cyber gates.
        </p>
        <button id="startBtn" class="btn-action">
          <i data-lucide="play" style="width: 18px; height: 18px;"></i>
          <span>LAUNCH</span>
        </button>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div style="font-size: 3rem;">💥</div>
        <div class="overlay-title" style="color: #f43f5e;">CRASHED!</div>
        <div style="font-family: 'JetBrains Mono'; font-size: 1.1rem; color: #f5f5f0;">
          Score: <span id="finalScore" style="color: #c8ff00; font-weight: 800;">0</span>
        </div>
        <button id="restartBtn" class="btn-action">
          <i data-lucide="rotate-ccw" style="width: 18px; height: 18px;"></i>
          <span>PLAY AGAIN</span>
        </button>
      </div>
    </div>

    <div class="hint-bar">
      Press <span class="hint-kbd">SPACEBAR</span> or <span class="hint-kbd">CLICK / TAP</span> to boost upward
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const finalScore = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    let bestScore = parseInt(localStorage.getItem('mano_cyberflap_best') || '0', 10);
    bestVal.textContent = bestScore;

    // WebAudio sound generator
    let audioCtx = null;
    function playSound(type) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;

        if (type === 'flap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(680, now + 0.08);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.08);
        } else if (type === 'score') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(587, now);
          osc.frequency.setValueAtTime(880, now + 0.06);
          gain.gain.setValueAtTime(0.1, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.2);
        } else if (type === 'hit') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, now);
          osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.25);
        }
      } catch (e) {}
    }

    // Game state
    let state = 'IDLE'; // IDLE, RUNNING, GAMEOVER
    let score = 0;
    let frames = 0;

    const bird = {
      x: 80,
      y: 200,
      radius: 14,
      velocity: 0,
      gravity: 0.38,
      jump: -6.8,
      rotation: 0
    };

    let pipes = [];
    let particles = [];
    let stars = [];

    // Background starfield
    for (let i = 0; i < 40; i++) {
      stars.push({
        x: Math.random() * 400,
        y: Math.random() * 480,
        size: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.4 + 0.2
      });
    }

    function createPipe() {
      const gap = 120;
      const minTop = 60;
      const maxTop = 480 - gap - 60;
      const topHeight = Math.floor(Math.random() * (maxTop - minTop) + minTop);
      pipes.push({
        x: 400,
        top: topHeight,
        bottom: 480 - (topHeight + gap),
        width: 52,
        passed: false
      });
    }

    function flap() {
      if (state !== 'RUNNING') return;
      bird.velocity = bird.jump;
      playSound('flap');

      // Spawn thruster particles
      for (let i = 0; i < 6; i++) {
        particles.push({
          x: bird.x - 12,
          y: bird.y + (Math.random() * 6 - 3),
          vx: -(Math.random() * 3 + 1.5),
          vy: Math.random() * 3 - 1.5,
          color: Math.random() > 0.4 ? '#c8ff00' : '#38bdf8',
          radius: Math.random() * 3 + 1.5,
          life: 1
        });
      }
    }

    function startGame() {
      state = 'RUNNING';
      score = 0;
      frames = 0;
      bird.y = 200;
      bird.velocity = 0;
      pipes = [];
      particles = [];
      scoreVal.textContent = '0';
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
      flap();
    }

    function gameOver() {
      state = 'GAMEOVER';
      playSound('hit');
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('mano_cyberflap_best', bestScore);
        bestVal.textContent = bestScore;
      }
      finalScore.textContent = score;
      gameOverOverlay.classList.remove('hidden');

      // Explosion particles
      for (let i = 0; i < 30; i++) {
        const angle = Math.random() * Math.PI * 2;
        const spd = Math.random() * 5 + 1;
        particles.push({
          x: bird.x,
          y: bird.y,
          vx: Math.cos(angle) * spd,
          vy: Math.sin(angle) * spd,
          color: ['#c8ff00', '#f43f5e', '#38bdf8', '#fbbf24'][Math.floor(Math.random() * 4)],
          radius: Math.random() * 4 + 2,
          life: 1
        });
      }
    }

    // Input handlers
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        if (state === 'IDLE' || state === 'GAMEOVER') startGame();
        else flap();
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      if (state === 'RUNNING') flap();
    });

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

    // Game loop
    function loop() {
      frames++;

      // Background
      ctx.fillStyle = '#090a0f';
      ctx.fillRect(0, 0, 400, 480);

      // Starfield
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      stars.forEach(s => {
        if (state === 'RUNNING') {
          s.x -= s.speed;
          if (s.x < 0) s.x = 400;
        }
        ctx.fillRect(s.x, s.y, s.size, s.size);
      });

      // Grid effect
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      ctx.lineWidth = 1;
      for (let y = 0; y < 480; y += 40) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(400, y);
        ctx.stroke();
      }

      if (state === 'RUNNING') {
        // Bird physics
        bird.velocity += bird.gravity;
        bird.y += bird.velocity;
        bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, bird.velocity * 0.08));

        // Pipe spawning
        if (frames % 100 === 0) {
          createPipe();
        }

        // Move pipes
        for (let i = pipes.length - 1; i >= 0; i--) {
          const p = pipes[i];
          p.x -= 2.2;

          // Check score
          if (!p.passed && p.x + p.width < bird.x) {
            p.passed = true;
            score++;
            scoreVal.textContent = score;
            playSound('score');
          }

          // Check collision
          const bx = bird.x;
          const by = bird.y;
          const br = bird.radius - 2;

          if (bx + br > p.x && bx - br < p.x + p.width) {
            if (by - br < p.top || by + br > 480 - p.bottom) {
              gameOver();
            }
          }

          // Remove offscreen
          if (p.x + p.width < 0) {
            pipes.splice(i, 1);
          }
        }

        // Floor / ceiling collision
        if (bird.y + bird.radius >= 480 || bird.y - bird.radius <= 0) {
          gameOver();
        }
      }

      // Draw pipes (Cyber Gates)
      pipes.forEach(p => {
        // Top gate
        const gradTop = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
        gradTop.addColorStop(0, '#151b28');
        gradTop.addColorStop(0.5, '#222d42');
        gradTop.addColorStop(1, '#151b28');

        ctx.fillStyle = gradTop;
        ctx.fillRect(p.x, 0, p.width, p.top);

        // Top gate cap
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(p.x - 3, p.top - 12, p.width + 6, 12);
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(p.x - 1, p.top - 3, p.width + 2, 3);
        ctx.shadowBlur = 0;

        // Bottom gate
        const gradBot = ctx.createLinearGradient(p.x, 0, p.x + p.width, 0);
        gradBot.addColorStop(0, '#151b28');
        gradBot.addColorStop(0.5, '#222d42');
        gradBot.addColorStop(1, '#151b28');

        ctx.fillStyle = gradBot;
        ctx.fillRect(p.x, 480 - p.bottom, p.width, p.bottom);

        // Bottom gate cap
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(p.x - 3, 480 - p.bottom, p.width + 6, 12);
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 10;
        ctx.fillStyle = '#38bdf8';
        ctx.fillRect(p.x - 1, 480 - p.bottom, p.width + 2, 3);
        ctx.shadowBlur = 0;
      });

      // Draw particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const pt = particles[i];
        pt.x += pt.vx;
        pt.y += pt.vy;
        pt.life -= 0.035;

        if (pt.life <= 0) {
          particles.splice(i, 1);
        } else {
          ctx.beginPath();
          ctx.arc(pt.x, pt.y, pt.radius * pt.life, 0, Math.PI * 2);
          ctx.fillStyle = pt.color;
          ctx.globalAlpha = pt.life;
          ctx.fill();
          ctx.globalAlpha = 1;
        }
      }

      // Draw bird / spaceship
      if (state !== 'GAMEOVER') {
        ctx.save();
        ctx.translate(bird.x, bird.y);
        ctx.rotate(bird.rotation);

        // Glow
        ctx.shadowColor = '#c8ff00';
        ctx.shadowBlur = 16;

        // Ship body
        ctx.fillStyle = '#c8ff00';
        ctx.beginPath();
        ctx.moveTo(14, 0);
        ctx.lineTo(-10, -9);
        ctx.lineTo(-6, 0);
        ctx.lineTo(-10, 9);
        ctx.closePath();
        ctx.fill();

        // Cockpit
        ctx.fillStyle = '#08090c';
        ctx.beginPath();
        ctx.arc(2, 0, 4, 0, Math.PI * 2);
        ctx.fill();

        // Thruster glow
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(-8, 0, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
      }

      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
