<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Animation & Visual Story Studio | MANO LAB</title>
  <meta name="description" content="Professional 2.5D Rigged Character Animation & Lip-Sync Studio. Real anatomical characters, natural breathing, eye blinking, audio-driven lip sync, and studio voice mastering.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23facc15%22/><text x=%2250%22 y=%2265%22 font-size=%2245%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22black%22>👑</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans, Montserrat & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Montserrat:wght@700;800;900&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles/story.css">
</head>
<body>

  <!-- Studio Header -->
  <header class="studio-header">
    <div class="brand-wrap">
      <div class="brand-icon">👑</div>
      <div>
        <div class="brand-title">CHARACTER ANIMATION & VISUAL STORY STUDIO</div>
        <div class="brand-pill">2.5D RIGGED CHARACTERS • REAL LIP-SYNC • STUDIO AUDIO</div>
      </div>
    </div>

    <div class="header-actions">
      <a href="../../index.html" class="btn-action">
        <span>⌂</span> <span>Mano Lab</span>
      </a>
    </div>
  </header>

  <!-- Studio Main Grid -->
  <main class="studio-main">

    <!-- Left Column: Character & Audio Director -->
    <section class="workspace-pane">

      <!-- 1. Real Character Selection -->
      <div class="card-panel">
        <div class="card-panel-header">
          <div class="card-panel-title">
            <span>👤</span> <span>1. Select Rigged Character Archetype</span>
          </div>
        </div>

        <div class="archetype-grid">
          <button class="btn-archetype active" data-archetype="WARRIOR_KING">
            <span class="arch-emoji">👑</span>
            <div class="arch-info">
              <strong>Rudra: Divine Warrior King</strong>
              <small>Golden Mukut, Surya cuirass armor, commanding aura</small>
            </div>
          </button>

          <button class="btn-archetype" data-archetype="MYSTIC_SAGE">
            <span class="arch-emoji">🕉️</span>
            <div class="arch-info">
              <strong>Rishi: The Ascetic Sage</strong>
              <small>Sacred Vibhuti, jata hair, rudraksha, ascetic wisdom</small>
            </div>
          </button>

          <button class="btn-archetype" data-archetype="SHADOW_LORD">
            <span class="arch-emoji">⚔️</span>
            <div class="arch-info">
              <strong>Asura: The Shadow Sovereign</strong>
              <small>Obsidian war helm, blazing crimson eyes, dark battle presence</small>
            </div>
          </button>

          <button class="btn-archetype" data-archetype="CELESTIAL_QUEEN">
            <span class="arch-emoji">🌸</span>
            <div class="arch-info">
              <strong>Devi: The Celestial Queen</strong>
              <small>Royal tiara, flowing hair physics, radiant peach skin</small>
            </div>
          </button>
        </div>
      </div>

      <!-- 2. Voice Studio & Real Lip-Sync -->
      <div class="card-panel">
        <div class="card-panel-header">
          <div class="card-panel-title">
            <span>🎙️</span> <span>2. Studio Voice & Lip-Sync Engine</span>
          </div>
        </div>

        <div style="display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap;">
          <button class="btn-action btn-action-primary" id="btn-record-mic">
            <span>🎙️</span> <span>Record My Voice (Mic)</span>
          </button>

          <label class="btn-action" style="cursor: pointer;">
            <span>📂</span> <span>Upload Custom Voice (MP3/WAV)</span>
            <input type="file" id="input-upload-audio" accept="audio/*" style="display: none;">
          </label>
        </div>

        <div class="scene-meta-row">
          <div>
            <label class="form-label">Studio Voice FX Chain</label>
            <select id="select-voice-fx" class="form-select">
              <option value="DEEP_NARRATOR">Deep Baritone Narrator (Warm EQ + Reverb)</option>
              <option value="DIVINE_DEITY">Divine Deity (Spacious Hall Reverb)</option>
              <option value="SHADOW_LORD">Shadow Lord (Heavy Low-End)</option>
              <option value="CLEAN_STUDIO">Clean Studio Master</option>
            </select>
          </div>

          <div>
            <label class="form-label">Environment Landscape</label>
            <select id="select-env" class="form-select">
              <option value="GOLDEN_TEMPLE">Golden Temple & Sun Halo</option>
              <option value="COSMIC_VOID">Deep Cosmic Nebula</option>
              <option value="VOLCANIC_WAR">Volcanic War Battlefield</option>
              <option value="HIMALAYAN_SUMMIT">Himalayan Summit</option>
            </select>
          </div>
        </div>

        <div class="form-group" style="margin-top: 14px;">
          <label class="form-label">Story Subtitle / Spoken Script</label>
          <input type="text" id="input-subtitle-text" class="input-topic" value="एक ही माँ के दो बेटे... शेषनाग और वासुकि!">
        </div>
      </div>

      <!-- 3. Cinematic Camera Director -->
      <div class="card-panel">
        <div class="card-panel-header">
          <div class="card-panel-title">
            <span>🎥</span> <span>3. Cinematic Camera Shots</span>
          </div>
        </div>

        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px;">
          <button class="btn-action btn-shot" data-shot="HERO_CLOSEUP">
            <span>🔍 Hero Close-Up</span>
          </button>
          <button class="btn-action btn-shot active" data-shot="MEDIUM_ACTION">
            <span>🎬 Medium Shot</span>
          </button>
          <button class="btn-action btn-shot" data-shot="DUTCH_LOW_ANGLE">
            <span>📐 Low-Angle Tilt</span>
          </button>
          <button class="btn-action btn-shot" data-shot="WIDE_ESTABLISHING">
            <span>🌐 Wide Reveal</span>
          </button>
        </div>
      </div>

    </section>

    <!-- Right Column: 9:16 Video Canvas Preview & Player -->
    <section class="preview-pane">

      <!-- Smartphone Bezel Mockup -->
      <div class="phone-mockup-frame">
        <div class="phone-notch"></div>
        <div class="recording-badge" id="recording-badge">
          <span>●</span> <span>RECORDING VIDEO</span>
        </div>
        <canvas id="story-canvas" width="540" height="960"></canvas>
      </div>

      <!-- Player Controls -->
      <div class="player-transport">
        <div class="transport-buttons">
          <button class="btn-transport primary" id="btn-play-pause" style="width: 100%; border-radius: 10px; height: 48px; font-size: 14px; font-weight: 700;">
            ▶ Play Narration
          </button>
        </div>

        <div style="margin-top: 10px;">
          <button class="btn-action btn-action-primary" id="btn-record-video" style="width: 100%; justify-content: center; padding: 14px; font-size: 13px;">
            <span>🔴</span> <span>Record & Export 9:16 Video</span>
          </button>
        </div>
      </div>

    </section>

  </main>

  <!-- Toast Notification -->
  <div class="toast-notice" id="toast-notice">Action successful!</div>

  <!-- Scripts -->
  <script src="scripts/character-rig.js"></script>
  <script src="scripts/audio-studio.js"></script>
  <script src="scripts/scene-director.js"></script>
  <script src="scripts/story-studio.js"></script>
</body>
</html>
