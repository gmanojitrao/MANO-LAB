<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Snake — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2240%22 fill=%22%2322c55e%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --text-dim: #9ca3af;
      --green: #22c55e;
      --red: #ef4444;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: manipulation;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #0d121f;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #334155; color: #fff; }
    .game-area {
      max-width: 480px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .score-item { display: flex; flex-direction: column; }
    .score-lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
    .score-val { font-size: 1.4rem; font-weight: 700; color: var(--green); }
    .canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #030712;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: 400px;
      background: #030712;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.85);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title { font-size: 1.8rem; font-weight: 800; }
    .btn-action {
      background: var(--green);
      color: #030712;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0.75rem 1.8rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-action:hover { transform: scale(1.03); background: #16a34a; }
    .controls-hint {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
    }
    .kbd {
      background: #1e293b;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }
    /* Mobile D-Pad */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 54px);
      grid-template-rows: repeat(2, 50px);
      gap: 6px;
      margin-top: 0.5rem;
    }
    .d-btn {
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .d-btn:active { background: var(--green); color: #000; }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: var(--green);">🐍</span>
      <span>Classic Snake</span>
    </div>
    <div style="width: 80px;"></div>
  </header>

  <div class="game-area">
    <div class="scoreboard">
      <div class="score-item">
        <span class="score-lbl">Score</span>
        <span id="scoreVal" class="score-val">0</span>
      </div>
      <div class="score-item" style="align-items: flex-end;">
        <span class="score-lbl">High Score</span>
        <span id="bestVal" class="score-val" style="color: #60a5fa;">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="400" height="400"></canvas>

      <!-- Start Overlay -->
      <div id="startOverlay" class="overlay">
        <div style="font-size: 2.5rem;">🐍</div>
        <div class="overlay-title">Classic Snake</div>
        <p style="color: var(--text-dim); font-size: 0.88rem; max-width: 260px;">
          Guide the snake, eat the apples, and avoid crashing into walls or yourself.
        </p>
        <button id="startBtn" class="btn-action">
          <i data-lucide="play" style="width: 16px; height: 16px;"></i>
          <span>START GAME</span>
        </button>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div style="font-size: 2.5rem;">💥</div>
        <div class="overlay-title" style="color: var(--red);">Game Over</div>
        <div style="font-family: 'JetBrains Mono'; font-size: 1.1rem; color: #fff;">
          Score: <span id="finalScore" style="color: var(--green); font-weight: 700;">0</span>
        </div>
        <button id="restartBtn" class="btn-action">
          <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
          <span>PLAY AGAIN</span>
        </button>
      </div>
    </div>

    <div class="controls-hint">
      Use <span class="kbd">ARROW KEYS</span> or <span class="kbd">W A S D</span> to steer
    </div>

    <!-- On-screen D-pad for mobile -->
    <div class="d-pad">
      <div></div>
      <button class="d-btn" id="dUp"><i data-lucide="chevron-up"></i></button>
      <div></div>
      <button class="d-btn" id="dLeft"><i data-lucide="chevron-left"></i></button>
      <button class="d-btn" id="dDown"><i data-lucide="chevron-down"></i></button>
      <button class="d-btn" id="dRight"><i data-lucide="chevron-right"></i></button>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const bestVal = document.getElementById('bestVal');
    const finalScore = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');

    const GRID = 20;
    const COLS = 20;
    const ROWS = 20;

    let bestScore = parseInt(localStorage.getItem('mano_snake_best') || '0', 10);
    bestVal.textContent = bestScore;

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let food = { x: 15, y: 10 };
    let score = 0;
    let state = 'IDLE'; // IDLE, RUNNING, GAMEOVER
    let lastTick = 0;
    const TICK_SPEED = 110; // ms per move

    // Clean audio blip
    let audioCtx = null;
    function playBeep(freq = 600, duration = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    function spawnFood() {
      let valid = false;
      while (!valid) {
        food.x = Math.floor(Math.random() * COLS);
        food.y = Math.floor(Math.random() * ROWS);
        valid = !snake.some(seg => seg.x === food.x && seg.y === food.y);
      }
    }

    function resetGame() {
      snake = [
        { x: 10, y: 10 },
        { x: 9, y: 10 },
        { x: 8, y: 10 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      scoreVal.textContent = '0';
      spawnFood();
      state = 'RUNNING';
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
    }

    function setGameOver() {
      state = 'GAMEOVER';
      playBeep(220, 0.2);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('mano_snake_best', bestScore);
        bestVal.textContent = bestScore;
      }
      finalScore.textContent = score;
      gameOverOverlay.classList.remove('hidden');
    }

    function update() {
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // Wall collision
      if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
        setGameOver();
        return;
      }

      // Self collision
      if (snake.some(seg => seg.x === head.x && seg.y === head.y)) {
        setGameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        scoreVal.textContent = score;
        playBeep(880, 0.08);
        spawnFood();
      } else {
        snake.pop();
      }
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, 400, 400);

      // Subtle grid lines
      ctx.strokeStyle = '#111827';
      ctx.lineWidth = 1;
      for (let i = 0; i < 400; i += GRID) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, 400);
        ctx.moveTo(0, i); ctx.lineTo(400, i);
        ctx.stroke();
      }

      // Food (Red Apple)
      ctx.fillStyle = '#ef4444';
      ctx.beginPath();
      ctx.arc(food.x * GRID + GRID / 2, food.y * GRID + GRID / 2, GRID / 2 - 2, 0, Math.PI * 2);
      ctx.fill();

      // Snake
      snake.forEach((seg, i) => {
        ctx.fillStyle = i === 0 ? '#4ade80' : '#22c55e';
        const x = seg.x * GRID + 1;
        const y = seg.y * GRID + 1;
        const size = GRID - 2;
        ctx.beginPath();
        ctx.roundRect(x, y, size, size, i === 0 ? 6 : 4);
        ctx.fill();

        // Eyes on head
        if (i === 0) {
          ctx.fillStyle = '#030712';
          const ex = x + (dir.x === 1 ? size - 4 : dir.x === -1 ? 4 : size / 2);
          const ey = y + (dir.y === 1 ? size - 4 : dir.y === -1 ? 4 : size / 2);
          ctx.beginPath();
          ctx.arc(ex, ey, 2, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function gameLoop(timestamp) {
      if (state === 'RUNNING') {
        if (timestamp - lastTick > TICK_SPEED) {
          update();
          lastTick = timestamp;
        }
      }
      draw();
      requestAnimationFrame(gameLoop);
    }

    // Controls
    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: -1 };
      if (['ArrowDown', 'KeyS'].includes(e.code) && dir.y === 0) nextDir = { x: 0, y: 1 };
      if (['ArrowLeft', 'KeyA'].includes(e.code) && dir.x === 0) nextDir = { x: -1, y: 0 };
      if (['ArrowRight', 'KeyD'].includes(e.code) && dir.x === 0) nextDir = { x: 1, y: 0 };
      if (e.code === 'Space' && (state === 'IDLE' || state === 'GAMEOVER')) resetGame();
    });

    document.getElementById('dUp').addEventListener('click', () => { if (dir.y === 0) nextDir = { x: 0, y: -1 }; });
    document.getElementById('dDown').addEventListener('click', () => { if (dir.y === 0) nextDir = { x: 0, y: 1 }; });
    document.getElementById('dLeft').addEventListener('click', () => { if (dir.x === 0) nextDir = { x: -1, y: 0 }; });
    document.getElementById('dRight').addEventListener('click', () => { if (dir.x === 0) nextDir = { x: 1, y: 0 }; });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    requestAnimationFrame(gameLoop);
  </script>
</body>
</html>
