<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Forge — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090a0d;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .container {
      max-width: 900px;
      margin: 2.5rem auto;
      padding: 0 1.5rem;
      width: 100%;
    }
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 3rem 2rem;
      text-align: center;
      background: #12141a;
      cursor: pointer;
      transition: all 0.2s;
    }
    .drop-zone:hover, .drop-zone.dragover {
      border-color: #c8ff00;
      background: rgba(200, 255, 0, 0.03);
    }
    .editor-grid {
      display: none;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 2rem;
      margin-top: 1.5rem;
    }
    @media (max-width: 768px) { .editor-grid { grid-template-columns: 1fr; } }
    .preview-box {
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 320px;
    }
    .preview-img {
      max-width: 100%;
      max-height: 320px;
      border-radius: 12px;
      object-fit: contain;
    }
    .controls-box {
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.75rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .control-row {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .label {
      font-size: 0.8rem;
      font-weight: 700;
      color: #9da3b4;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    select, input[type="range"], input[type="number"] {
      width: 100%;
      padding: 0.6rem 0.85rem;
      background: #1a1e27;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #fff;
      font-family: inherit;
      outline: none;
    }
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.85rem;
      background: #c8ff00;
      color: #090a0d;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: all 0.15s;
    }
    .btn-download:hover { background: #d8ff33; transform: scale(1.02); }
    .stats-badge {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem;
      background: #181b22;
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">⚡</span>
      <span>Image Forge — Privacy Converter</span>
    </div>
    <div style="font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace;">100% In-Browser • Zero Uploads</div>
  </header>

  <div class="container">
    <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
      <i data-lucide="image-up" style="width: 48px; height: 48px; color: #c8ff00; margin-bottom: 1rem;"></i>
      <h3 style="font-size: 1.25rem; font-weight: 800; margin-bottom: 0.5rem;">Drop an image or click to browse</h3>
      <p style="color: #7a8294; font-size: 0.85rem;">Resize, compress & convert to WebP / PNG / JPEG with zero server uploads.</p>
      <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFile(this.files[0])">
    </div>

    <div class="editor-grid" id="editorGrid">
      <div class="preview-box">
        <img id="previewImg" class="preview-img" alt="Preview">
      </div>

      <div class="controls-box">
        <div class="stats-badge">
          <span style="color: #7a8294;">Original: <span id="origSize" style="color: #fff;">0 KB</span></span>
          <span style="color: #c8ff00;">New: <span id="newSize">0 KB</span></span>
        </div>

        <div class="control-row">
          <label class="label">Export Format</label>
          <select id="selectFormat" onchange="processImage()">
            <option value="image/webp">WebP (Smallest file size)</option>
            <option value="image/jpeg">JPEG (Universal)</option>
            <option value="image/png">PNG (Lossless)</option>
          </select>
        </div>

        <div class="control-row">
          <div style="display: flex; justify-content: space-between;">
            <label class="label">Quality</label>
            <span id="qualityVal" style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #c8ff00;">80%</span>
          </div>
          <input type="range" id="qualityRange" min="0.1" max="1" step="0.05" value="0.8" oninput="document.getElementById('qualityVal').textContent = Math.round(this.value*100) + '%'; processImage();">
        </div>

        <div class="control-row">
          <div style="display: flex; justify-content: space-between;">
            <label class="label">Scale Factor</label>
            <span id="scaleVal" style="font-family: 'JetBrains Mono', monospace; font-size: 0.75rem; color: #c8ff00;">100%</span>
          </div>
          <input type="range" id="scaleRange" min="0.2" max="1" step="0.1" value="1" oninput="document.getElementById('scaleVal').textContent = Math.round(this.value*100) + '%'; processImage();">
        </div>

        <button class="btn-download" onclick="downloadImage()">
          <i data-lucide="download" style="width: 16px; height: 16px;"></i>
          <span>Save Processed Image</span>
        </button>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    let rawImg = null;
    let originalBytes = 0;
    let processedBlob = null;

    function handleFile(file) {
      if (!file) return;
      originalBytes = file.size;
      document.getElementById('origSize').textContent = (file.size / 1024).toFixed(1) + ' KB';

      const reader = new FileReader();
      reader.onload = (e) => {
        rawImg = new Image();
        rawImg.onload = () => {
          document.getElementById('dropZone').style.display = 'none';
          document.getElementById('editorGrid').style.display = 'grid';
          processImage();
        };
        rawImg.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

    function processImage() {
      if (!rawImg) return;
      const scale = parseFloat(document.getElementById('scaleRange').value);
      const quality = parseFloat(document.getElementById('qualityRange').value);
      const format = document.getElementById('selectFormat').value;

      const canvas = document.createElement('canvas');
      canvas.width = Math.round(rawImg.width * scale);
      canvas.height = Math.round(rawImg.height * scale);

      const ctx = canvas.getContext('2d');
      ctx.drawImage(rawImg, 0, 0, canvas.width, canvas.height);

      canvas.toBlob((blob) => {
        processedBlob = blob;
        document.getElementById('previewImg').src = URL.createObjectURL(blob);
        document.getElementById('newSize').textContent = (blob.size / 1024).toFixed(1) + ' KB';
      }, format, quality);
    }

    function downloadImage() {
      if (!processedBlob) return;
      const format = document.getElementById('selectFormat').value;
      const ext = format === 'image/webp' ? 'webp' : (format === 'image/png' ? 'png' : 'jpg');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(processedBlob);
      a.download = `forge-export.${ext}`;
      a.click();
    }

    // Drag-and-drop listeners
    const dropZone = document.getElementById('dropZone');
    ['dragenter', 'dragover'].forEach(n => dropZone.addEventListener(n, (e) => { e.preventDefault(); dropZone.classList.add('dragover'); }));
    ['dragleave', 'drop'].forEach(n => dropZone.addEventListener(n, (e) => { e.preventDefault(); dropZone.classList.remove('dragover'); }));
    dropZone.addEventListener('drop', (e) => {
      if (e.dataTransfer.files && e.dataTransfer.files[0]) {
        handleFile(e.dataTransfer.files[0]);
      }
    });
  </script>
</body>
</html>
