<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SynthPad — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #08090c;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .container {
      max-width: 900px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .top-panel {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
    }
    @media (max-width: 680px) { .top-panel { grid-template-columns: 1fr; } }
    .scope-box {
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    #scopeCanvas {
      width: 100%;
      height: 110px;
      background: #06070a;
      border-radius: 12px;
    }
    .controls-box {
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .wave-btns {
      display: flex;
      gap: 0.5rem;
    }
    .wave-btn {
      flex: 1;
      padding: 0.5rem 0.2rem;
      background: #1a1e27;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #a0a6b5;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
      text-transform: uppercase;
      font-family: 'JetBrains Mono', monospace;
    }
    .wave-btn.active {
      background: #c8ff00;
      color: #08090c;
      border-color: #c8ff00;
      box-shadow: 0 0 12px rgba(200, 255, 0, 0.3);
    }
    
    /* Drum Pads */
    .drums-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
    }
    .pad-btn {
      height: 80px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: transform 0.08s, background 0.08s;
    }
    .pad-btn:active { transform: scale(0.95); }
    .pad-kick { background: #1a162b; border-color: #a855f7; color: #d8b4fe; }
    .pad-snare { background: #1c1f2b; border-color: #38bdf8; color: #7dd3fc; }
    .pad-hihat { background: #26241a; border-color: #facc15; color: #fef08a; }
    .pad-laser { background: #26161b; border-color: #f43f5e; color: #fda4af; }

    /* Piano Keyboard */
    .piano-box {
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 1.5rem;
      position: relative;
    }
    .piano-keys {
      display: flex;
      position: relative;
      height: 180px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .white-key {
      flex: 1;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 0 0 8px 8px;
      color: #0f172a;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0.75rem;
      font-size: 0.75rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: background 0.08s, transform 0.08s;
      z-index: 1;
    }
    .white-key.active, .white-key:active { background: #c8ff00; transform: translateY(3px); }
    .black-key {
      width: 6.5%;
      height: 60%;
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 0 0 6px 6px;
      position: absolute;
      z-index: 2;
      color: #94a3b8;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 0.5rem;
      font-size: 0.65rem;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
      cursor: pointer;
      transition: background 0.08s;
    }
    .black-key.active, .black-key:active { background: #f43f5e; color: #fff; }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">🎹</span>
      <span>SynthPad — Mini Keyboard & Beat Synthesizer</span>
    </div>
    <div style="font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace;">Keys: A to K • Zero Lag</div>
  </header>

  <div class="container">
    <div class="top-panel">
      <!-- Oscilloscope Visualizer -->
      <div class="scope-box">
        <div style="font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: #7a8294; display: flex; justify-content: space-between;">
          <span>AUDIO OSCILLOSCOPE</span>
          <span style="color: #c8ff00;">LIVE 60FPS</span>
        </div>
        <canvas id="scopeCanvas"></canvas>
      </div>

      <!-- Controls -->
      <div class="controls-box">
        <div>
          <div style="font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: #7a8294; margin-bottom: 0.5rem;">WAVEFORM OSCILLATOR</div>
          <div class="wave-btns">
            <button class="wave-btn active" onclick="setWave('sine', this)">Sine</button>
            <button class="wave-btn" onclick="setWave('triangle', this)">Tri</button>
            <button class="wave-btn" onclick="setWave('sawtooth', this)">Saw</button>
            <button class="wave-btn" onclick="setWave('square', this)">Sqr</button>
          </div>
        </div>

        <div style="margin-top: 1rem;">
          <div style="font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; color: #7a8294; margin-bottom: 0.25rem;">ECHO / DELAY TIME</div>
          <input type="range" id="delayRange" min="0" max="0.6" step="0.05" value="0.25" style="width: 100%; accent-color: #c8ff00;">
        </div>
      </div>
    </div>

    <!-- 4 Beat Pads -->
    <div class="drums-grid">
      <button class="pad-btn pad-kick" onclick="playDrum('kick')">
        <span>🥁 KICK</span>
        <span style="font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; opacity: 0.7;">Key: 1</span>
      </button>
      <button class="pad-btn pad-snare" onclick="playDrum('snare')">
        <span>💥 SNARE</span>
        <span style="font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; opacity: 0.7;">Key: 2</span>
      </button>
      <button class="pad-btn pad-hihat" onclick="playDrum('hihat')">
        <span>✨ HI-HAT</span>
        <span style="font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; opacity: 0.7;">Key: 3</span>
      </button>
      <button class="pad-btn pad-laser" onclick="playDrum('laser')">
        <span>⚡ ZAP</span>
        <span style="font-size: 0.7rem; font-family: 'JetBrains Mono', monospace; opacity: 0.7;">Key: 4</span>
      </button>
    </div>

    <!-- Piano Keys -->
    <div class="piano-box">
      <div class="piano-keys" id="pianoKeys">
        <!-- White keys -->
        <div class="white-key" data-note="261.63" data-key="a"><span>C (A)</span></div>
        <div class="white-key" data-note="293.66" data-key="s"><span>D (S)</span></div>
        <div class="white-key" data-note="329.63" data-key="d"><span>E (D)</span></div>
        <div class="white-key" data-note="349.23" data-key="f"><span>F (F)</span></div>
        <div class="white-key" data-note="392.00" data-key="g"><span>G (G)</span></div>
        <div class="white-key" data-note="440.00" data-key="h"><span>A (H)</span></div>
        <div class="white-key" data-note="493.88" data-key="j"><span>B (J)</span></div>
        <div class="white-key" data-note="523.25" data-key="k"><span>C5 (K)</span></div>

        <!-- Black keys -->
        <div class="black-key" style="left: 8.5%;" data-note="277.18" data-key="w"><span>W</span></div>
        <div class="black-key" style="left: 21%;" data-note="311.13" data-key="e"><span>E</span></div>
        <div class="black-key" style="left: 46%;" data-note="369.99" data-key="t"><span>T</span></div>
        <div class="black-key" style="left: 58.5%;" data-note="415.30" data-key="y"><span>Y</span></div>
        <div class="black-key" style="left: 71%;" data-note="466.16" data-key="u"><span>U</span></div>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    let audioCtx = null;
    let analyser = null;
    let currentWave = 'sine';
    let delayNode = null;
    let delayFeedback = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 256;

      delayNode = audioCtx.createDelay();
      delayNode.delayTime.value = 0.25;
      delayFeedback = audioCtx.createGain();
      delayFeedback.gain.value = 0.35;

      delayNode.connect(delayFeedback);
      delayFeedback.connect(delayNode);
      delayNode.connect(analyser);

      analyser.connect(audioCtx.destination);
      initScope();
    }

    function setWave(w, btn) {
      currentWave = w;
      document.querySelectorAll('.wave-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    }

    function playNote(freq) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = currentWave;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.6);

      osc.connect(gain);
      gain.connect(analyser);

      // Connect to delay if active
      const dTime = parseFloat(document.getElementById('delayRange').value);
      if (dTime > 0) {
        delayNode.delayTime.value = dTime;
        gain.connect(delayNode);
      }

      osc.start();
      osc.stop(audioCtx.currentTime + 0.65);
    }

    function playDrum(type) {
      initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const t = audioCtx.currentTime;

      if (type === 'kick') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.setValueAtTime(140, t);
        osc.frequency.exponentialRampToValueAtTime(0.01, t + 0.3);
        gain.gain.setValueAtTime(0.6, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
        osc.connect(gain);
        gain.connect(analyser);
        osc.start(t);
        osc.stop(t + 0.3);
      } else if (type === 'snare') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, t);
        gain.gain.setValueAtTime(0.4, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.2);
        osc.connect(gain);
        gain.connect(analyser);
        osc.start(t);
        osc.stop(t + 0.2);
      } else if (type === 'hihat') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(8000, t);
        gain.gain.setValueAtTime(0.15, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
        osc.connect(gain);
        gain.connect(analyser);
        osc.start(t);
        osc.stop(t + 0.06);
      } else if (type === 'laser') {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(1800, t);
        osc.frequency.exponentialRampToValueAtTime(80, t + 0.25);
        gain.gain.setValueAtTime(0.3, t);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
        osc.connect(gain);
        gain.connect(analyser);
        osc.start(t);
        osc.stop(t + 0.25);
      }
    }

    // Oscilloscope canvas rendering
    function initScope() {
      const canvas = document.getElementById('scopeCanvas');
      const ctx = canvas.getContext('2d');
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
      const dataArray = new Uint8Array(analyser.frequencyBinCount);

      function draw() {
        requestAnimationFrame(draw);
        analyser.getByteTimeDomainData(dataArray);

        ctx.fillStyle = '#06070a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.lineWidth = 2;
        ctx.strokeStyle = '#c8ff00';
        ctx.beginPath();

        const sliceWidth = canvas.width / dataArray.length;
        let x = 0;

        for (let i = 0; i < dataArray.length; i++) {
          const v = dataArray[i] / 128.0;
          const y = (v * canvas.height) / 2;
          if (i === 0) ctx.moveTo(x, y);
          else ctx.lineTo(x, y);
          x += sliceWidth;
        }

        ctx.lineTo(canvas.width, canvas.height / 2);
        ctx.stroke();
      }
      draw();
    }

    // Click on piano keys
    document.querySelectorAll('.white-key, .black-key').forEach(key => {
      key.addEventListener('mousedown', () => {
        const freq = parseFloat(key.getAttribute('data-note'));
        playNote(freq);
        key.classList.add('active');
      });
      key.addEventListener('mouseup', () => key.classList.remove('active'));
      key.addEventListener('mouseleave', () => key.classList.remove('active'));
    });

    // Computer keyboard listeners
    const keyMap = {
      'a': 261.63, 'w': 277.18, 's': 293.66, 'e': 311.13, 'd': 329.63,
      'f': 349.23, 't': 369.99, 'g': 392.00, 'y': 415.30, 'h': 440.00,
      'u': 466.16, 'j': 493.88, 'k': 523.25
    };

    window.addEventListener('keydown', (e) => {
      const k = e.key.toLowerCase();
      if (keyMap[k]) {
        playNote(keyMap[k]);
        const el = document.querySelector(`[data-key="${k}"]`);
        if (el) el.classList.add('active');
      } else if (k === '1') playDrum('kick');
      else if (k === '2') playDrum('snare');
      else if (k === '3') playDrum('hihat');
      else if (k === '4') playDrum('laser');
    });

    window.addEventListener('keyup', (e) => {
      const k = e.key.toLowerCase();
      const el = document.querySelector(`[data-key="${k}"]`);
      if (el) el.classList.remove('active');
    });
  </script>
</body>
</html>
