<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Neon Breakout — MANO-LAB Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #08090c;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: none;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .game-container {
      max-width: 560px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0.75rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .score-item { display: flex; flex-direction: column; }
    .score-lbl { font-size: 0.7rem; color: #7a8294; text-transform: uppercase; }
    .score-val { font-size: 1.4rem; font-weight: 800; color: #c8ff00; }
    .canvas-wrap {
      width: 100%;
      aspect-ratio: 4 / 5;
      background: #040507;
      border: 2px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.1);
      position: relative;
      overflow: hidden;
      cursor: none;
    }
    #gameCanvas { width: 100%; height: 100%; display: block; }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 7, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      cursor: default;
    }
    .overlay.hidden { display: none; }
    .btn-play {
      padding: 0.85rem 2.2rem;
      background: #38bdf8;
      color: #08090c;
      font-weight: 800;
      font-size: 1.1rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(56, 189, 248, 0.4);
      transition: transform 0.15s;
    }
    .btn-play:hover { transform: scale(1.05); }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #38bdf8;">🕹️</span>
      <span>Neon Breakout Arcade</span>
    </div>
    <div style="font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace;">Mouse / Touch to Move Paddle</div>
  </header>

  <div class="game-container">
    <div class="scoreboard">
      <div class="score-item">
        <span class="score-lbl">Score</span>
        <span class="score-val" id="scoreVal">0</span>
      </div>
      <div class="score-item" style="text-align: center;">
        <span class="score-lbl">Lives</span>
        <span class="score-val" id="livesVal" style="color: #f43f5e;">❤️❤️❤️</span>
      </div>
      <div class="score-item" style="text-align: right;">
        <span class="score-lbl">High Score</span>
        <span class="score-val" id="highScoreVal" style="color: #38bdf8;">0</span>
      </div>
    </div>

    <div class="canvas-wrap" id="canvasWrap">
      <canvas id="gameCanvas" width="480" height="600"></canvas>
      <div class="overlay" id="overlay">
        <div style="font-size: 2.5rem; margin-bottom: -0.5rem;">💥</div>
        <h2 id="overlayTitle" style="font-size: 1.8rem; font-weight: 800;">NEON BREAKOUT</h2>
        <p id="overlayDesc" style="color: #7a8294; font-size: 0.9rem;">Smash all bricks, keep the ball alive!</p>
        <button class="btn-play" onclick="startGame()">START GAME</button>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let score = 0;
    let lives = 3;
    let highScore = parseInt(localStorage.getItem('mano_breakout_hi') || '0', 10);
    document.getElementById('highScoreVal').textContent = highScore;

    // Paddle
    const paddle = {
      w: 90,
      h: 12,
      x: (canvas.width - 90) / 2,
      y: canvas.height - 35
    };

    // Ball
    const ball = {
      x: canvas.width / 2,
      y: canvas.height - 60,
      dx: 4,
      dy: -4,
      r: 6,
      trail: []
    };

    // Bricks
    const brickRows = 6;
    const brickCols = 8;
    const brickW = 50;
    const brickH = 16;
    const brickPadding = 6;
    const brickOffsetTop = 50;
    const brickOffsetLeft = (canvas.width - (brickCols * (brickW + brickPadding) - brickPadding)) / 2;

    const rowColors = ['#f43f5e', '#fbbf24', '#c8ff00', '#34d399', '#38bdf8', '#c084fc'];
    let bricks = [];
    let particles = [];
    let isRunning = false;
    let animId = null;
    let audioCtx = null;

    function initBricks() {
      bricks = [];
      for (let c = 0; c < brickCols; c++) {
        bricks[c] = [];
        for (let r = 0; r < brickRows; r++) {
          bricks[c][r] = { x: 0, y: 0, status: 1, color: rowColors[r % rowColors.length] };
        }
      }
    }

    function playTone(freq, type = 'sine', duration = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');
      score = 0;
      lives = 3;
      document.getElementById('scoreVal').textContent = '0';
      document.getElementById('livesVal').textContent = '❤️❤️❤️';
      initBricks();
      resetBall();
      isRunning = true;
      if (animId) cancelAnimationFrame(animId);
      loop();
    }

    function resetBall() {
      ball.x = canvas.width / 2;
      ball.y = canvas.height - 60;
      ball.dx = (Math.random() > 0.5 ? 4 : -4);
      ball.dy = -4.5;
      ball.trail = [];
    }

    // Paddle move listener
    canvas.addEventListener('mousemove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const relativeX = (e.clientX - rect.left) * (canvas.width / rect.width);
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relativeX - paddle.w / 2));
    });

    canvas.addEventListener('touchmove', (e) => {
      if (e.touches && e.touches[0]) {
        const rect = canvas.getBoundingClientRect();
        const relativeX = (e.touches[0].clientX - rect.left) * (canvas.width / rect.width);
        paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, relativeX - paddle.w / 2));
      }
    });

    function collisionDetection() {
      let activeBricks = 0;
      for (let c = 0; c < brickCols; c++) {
        for (let r = 0; r < brickRows; r++) {
          const b = bricks[c][r];
          if (b.status === 1) {
            activeBricks++;
            if (ball.x > b.x && ball.x < b.x + brickW && ball.y > b.y && ball.y < b.y + brickH) {
              ball.dy = -ball.dy;
              b.status = 0;
              score += 20;
              document.getElementById('scoreVal').textContent = score;
              playTone(500 + r * 60, 'triangle', 0.06);
              spawnBrickParticles(b.x + brickW / 2, b.y + brickH / 2, b.color);

              if (score > highScore) {
                highScore = score;
                localStorage.setItem('mano_breakout_hi', highScore);
                document.getElementById('highScoreVal').textContent = highScore;
              }
            }
          }
        }
      }

      if (activeBricks === 0) {
        initBricks();
        resetBall();
        playTone(1000, 'sine', 0.2);
      }
    }

    function spawnBrickParticles(x, y, color) {
      for (let i = 0; i < 10; i++) {
        particles.push({
          x: x, y: y,
          vx: (Math.random() - 0.5) * 7,
          vy: (Math.random() - 0.5) * 7,
          life: 1,
          color: color
        });
      }
    }

    function loop() {
      if (!isRunning) return;

      // Ball trail
      ball.trail.push({ x: ball.x, y: ball.y });
      if (ball.trail.length > 8) ball.trail.shift();

      // Ball bounce walls
      if (ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) {
        ball.dx = -ball.dx;
        playTone(320, 'sine', 0.03);
      }
      if (ball.y + ball.dy < ball.r) {
        ball.dy = -ball.dy;
        playTone(360, 'sine', 0.03);
      } else if (ball.y + ball.dy > paddle.y - ball.r && ball.y < paddle.y + paddle.h) {
        // Paddle collision
        if (ball.x > paddle.x && ball.x < paddle.x + paddle.w) {
          const hitOffset = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
          ball.dx = hitOffset * 5.5;
          ball.dy = -Math.abs(ball.dy) * 1.02; // speed up slightly
          playTone(600, 'sine', 0.04);
        }
      } else if (ball.y + ball.dy > canvas.height) {
        // Lost life
        lives--;
        playTone(180, 'sawtooth', 0.2);
        document.getElementById('livesVal').textContent = '❤️'.repeat(Math.max(0, lives));
        if (lives <= 0) {
          isRunning = false;
          document.getElementById('overlayTitle').textContent = 'GAME OVER';
          document.getElementById('overlayDesc').textContent = `Final Score: ${score} points!`;
          document.getElementById('overlay').classList.remove('hidden');
          return;
        } else {
          resetBall();
        }
      }

      ball.x += ball.dx;
      ball.y += ball.dy;

      collisionDetection();
      draw();
      animId = requestAnimationFrame(loop);
    }

    function draw() {
      ctx.fillStyle = '#040507';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Bricks
      for (let c = 0; c < brickCols; c++) {
        for (let r = 0; r < brickRows; r++) {
          if (bricks[c][r].status === 1) {
            const brickX = c * (brickW + brickPadding) + brickOffsetLeft;
            const brickY = r * (brickH + brickPadding) + brickOffsetTop;
            bricks[c][r].x = brickX;
            bricks[c][r].y = brickY;
            ctx.fillStyle = bricks[c][r].color;
            ctx.shadowColor = bricks[c][r].color;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.roundRect(brickX, brickY, brickW, brickH, 4);
            ctx.fill();
          }
        }
      }
      ctx.shadowBlur = 0;

      // Draw Ball Trail
      ball.trail.forEach((t, i) => {
        ctx.fillStyle = `rgba(56, 189, 248, ${i / 14})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, ball.r * (i / 8), 0, Math.PI * 2);
        ctx.fill();
      });

      // Draw Ball
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();

      // Draw Paddle
      ctx.fillStyle = '#38bdf8';
      ctx.shadowColor = '#38bdf8';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Particles
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.04;
        if (p.life <= 0) {
          particles.splice(idx, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2 * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }
  </script>
</body>
</html>
