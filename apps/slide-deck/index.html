<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SlideCraft - Intelligent Document to Slide Deck Studio</title>
  <meta name="description" content="Drop any document, text, or transcript and instantly generate gorgeous 16:9 presentation slide decks. Zero configuration, eye-comforting themes.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2222%22 fill=%22%23c25e38%22/><text x=%2250%22 y=%2265%22 font-size=%2245%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22white%22>📽️</text></svg>">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,800;1,600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg: #faf8f5;
      --card-bg: #ffffff;
      --card-border: #e7e2d9;
      --card-hover: #f5f2ea;
      --accent: #c25e38;
      --accent-hover: #a84d2a;
      --accent-sage: #2e7d5b;
      --text: #1c1917;
      --text-muted: #57534e;
      --text-dim: #78716c;
      --font-sans: 'Plus Jakarta Sans', -apple-system, sans-serif;
      --font-serif: 'Playfair Display', Georgia, serif;
      --font-mono: 'JetBrains Mono', monospace;
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Studio Header */
    .header {
      height: 60px;
      background: rgba(250, 248, 245, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      flex-shrink: 0;
      z-index: 50;
    }

    .brand-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
      text-decoration: none;
      color: inherit;
    }

    .brand-logo {
      width: 34px;
      height: 34px;
      border-radius: 9px;
      background: linear-gradient(135deg, #c25e38 0%, #b45309 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-size: 17px;
      box-shadow: 0 2px 10px rgba(194, 94, 56, 0.25);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .brand-pill {
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(194, 94, 56, 0.1);
      color: var(--accent);
      border: 1px solid rgba(194, 94, 56, 0.25);
      margin-left: 6px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-action {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 7px 13px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text-muted);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .btn-primary-present {
      background: var(--accent);
      color: #fff;
      border: none;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(194, 94, 56, 0.25);
    }

    .btn-primary-present:hover {
      background: var(--accent-hover);
      color: #fff;
    }

    /* Main Split Layout */
    .studio-layout {
      flex: 1;
      display: grid;
      grid-template-columns: 480px 1fr;
      height: calc(100vh - 60px);
      overflow: hidden;
    }

    /* Left Pane */
    .editor-pane {
      background: #faf8f5;
      border-right: 1px solid var(--card-border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* Top Mode Tabs */
    .input-tabs {
      display: flex;
      background: #ede8df;
      padding: 4px;
      border-bottom: 1px solid var(--card-border);
    }

    .input-tab {
      flex: 1;
      padding: 8px 12px;
      border-radius: 6px;
      border: none;
      background: transparent;
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.15s;
    }

    .input-tab.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 1px 4px rgba(0,0,0,0.06);
    }

    .editor-toolbar {
      padding: 10px 16px;
      background: #f7f4ee;
      border-bottom: 1px solid var(--card-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .theme-select {
      background: #ffffff;
      border: 1px solid var(--card-border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      outline: none;
      cursor: pointer;
    }

    /* Auto-Gen View */
    .autogen-view {
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .doc-dropzone {
      border: 2px dashed #d8d0c2;
      border-radius: var(--radius-md);
      padding: 28px 16px;
      text-align: center;
      background: #ffffff;
      cursor: pointer;
      transition: all 0.2s;
    }

    .doc-dropzone:hover {
      border-color: var(--accent);
      background: #fdfbf7;
    }

    .raw-textarea {
      flex: 1;
      width: 100%;
      min-height: 220px;
      background: #ffffff;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.6;
      padding: 14px;
      outline: none;
      resize: vertical;
    }

    .raw-textarea:focus {
      border-color: var(--accent);
    }

    .btn-synthesize {
      padding: 12px 18px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(194, 94, 56, 0.25);
    }

    .btn-synthesize:hover {
      background: var(--accent-hover);
    }

    /* Markdown Editor View */
    .markdown-view {
      flex: 1;
      display: none;
      flex-direction: column;
      height: 100%;
    }

    .markdown-textarea {
      flex: 1;
      width: 100%;
      background: #ffffff;
      border: none;
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 13px;
      line-height: 1.6;
      padding: 16px;
      outline: none;
      resize: none;
    }

    /* Right Preview Pane */
    .preview-pane {
      background: #f4f0e8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px;
      position: relative;
      overflow: hidden;
    }

    /* 16:9 Canvas Frame */
    .slide-canvas-wrap {
      width: 100%;
      max-width: 900px;
      aspect-ratio: 16 / 9;
      box-shadow: 0 16px 40px rgba(60, 50, 40, 0.12);
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      transition: all 0.3s;
    }

    .slide-canvas {
      width: 100%;
      height: 100%;
      padding: 5% 7%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: relative;
      overflow: hidden;
      box-sizing: border-box;
      user-select: text;
    }

    /* Themes (Warm, Eye-Comforting) */
    /* Theme 1: Warm Alabaster (Default) */
    .theme-warm-alabaster {
      background: #fcfbf8;
      color: #1c1917;
      border: 1px solid #e7e2d9;
    }
    .theme-warm-alabaster h1 { font-family: var(--font-serif); font-size: 2.8vw; color: #1c1917; margin-bottom: 0.6em; line-height: 1.2; }
    .theme-warm-alabaster h2 { font-family: var(--font-sans); font-size: 2vw; color: #c25e38; margin-bottom: 0.5em; font-weight: 800; }
    .theme-warm-alabaster h3 { font-size: 1.4vw; color: #57534e; margin-bottom: 0.5em; }
    .theme-warm-alabaster p, .theme-warm-alabaster li { font-size: 1.3vw; color: #44403c; line-height: 1.6; margin-bottom: 0.5em; }
    .theme-warm-alabaster .pill { background: rgba(194, 94, 56, 0.1); color: #c25e38; border: 1px solid rgba(194, 94, 56, 0.25); }

    /* Theme 2: Warm Sepia */
    .theme-sepia {
      background: #f7f2e7;
      color: #2d2823;
      border: 1px solid #e2dac9;
    }
    .theme-sepia h1 { font-family: var(--font-serif); font-size: 2.8vw; color: #2d2823; margin-bottom: 0.6em; }
    .theme-sepia h2 { font-size: 2vw; color: #b45309; margin-bottom: 0.5em; font-weight: 800; }
    .theme-sepia p, .theme-sepia li { font-size: 1.3vw; color: #453e37; line-height: 1.6; }

    /* Theme 3: Muted Sage Minimal */
    .theme-sage {
      background: #f3f6f3;
      color: #1a2e22;
      border: 1px solid #d5ded6;
    }
    .theme-sage h1 { font-size: 2.8vw; color: #1a2e22; margin-bottom: 0.6em; font-weight: 800; }
    .theme-sage h2 { font-size: 2vw; color: #2e7d5b; margin-bottom: 0.5em; }
    .theme-sage p, .theme-sage li { font-size: 1.3vw; color: #324a3c; line-height: 1.6; }

    /* Theme 4: Cozy Espresso */
    .theme-espresso {
      background: #1c1917;
      color: #f5f5f4;
      border: 1px solid #292524;
    }
    .theme-espresso h1 { font-family: var(--font-serif); font-size: 2.8vw; color: #f5f5f4; margin-bottom: 0.6em; }
    .theme-espresso h2 { font-size: 2vw; color: #f59e0b; margin-bottom: 0.5em; }
    .theme-espresso p, .theme-espresso li { font-size: 1.3vw; color: #d6d3d1; line-height: 1.6; }

    /* Theme 5: Clean White */
    .theme-clean-white {
      background: #ffffff;
      color: #0f172a;
      border: 1px solid #e2e8f0;
    }
    .theme-clean-white h1 { font-size: 2.8vw; color: #0f172a; margin-bottom: 0.6em; font-weight: 800; }
    .theme-clean-white h2 { font-size: 2vw; color: #0284c7; margin-bottom: 0.5em; }
    .theme-clean-white p, .theme-clean-white li { font-size: 1.3vw; color: #334155; line-height: 1.6; }

    /* Slide Elements */
    .pill {
      display: inline-block;
      padding: 0.25em 0.8em;
      border-radius: 9999px;
      font-size: 0.9vw;
      font-weight: 700;
      margin-bottom: 1em;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .slide-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 2vw;
      margin-top: 1em;
    }

    .slide-card-box {
      background: rgba(0, 0, 0, 0.03);
      padding: 1.2vw;
      border-radius: 8px;
      border: 1px solid rgba(0,0,0,0.06);
    }

    .theme-espresso .slide-card-box {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
    }

    /* Slide Bottom Bar Navigation */
    .slide-nav-bar {
      margin-top: 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      background: #ffffff;
      padding: 6px 14px;
      border-radius: 9999px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 12px rgba(60, 50, 40, 0.06);
    }

    .nav-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      border-radius: 50%;
      transition: all 0.15s;
    }

    .nav-btn:hover:not(:disabled) {
      background: #ede8df;
      color: var(--text);
    }

    .nav-btn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .slide-counter {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
    }

    /* Fullscreen Presenter Mode */
    .present-mode {
      position: fixed !important;
      top: 0 !important; left: 0 !important; right: 0 !important; bottom: 0 !important;
      width: 100vw !important; height: 100vh !important;
      max-width: none !important;
      border-radius: 0 !important;
      z-index: 9999 !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
      border: none !important;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1c1917;
      color: #fff;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      opacity: 0;
      transition: all 0.25s ease;
      z-index: 200;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <a href="../../" class="brand-wrap">
      <div class="brand-logo">📽️</div>
      <div>
        <div class="brand-title">SlideCraft <span class="brand-pill">Intelligent Slides</span></div>
      </div>
    </a>

    <div class="header-actions">
      <select class="theme-select" id="themeSelect" onchange="changeTheme(this.value)">
        <option value="theme-warm-alabaster">Warm Alabaster (Default)</option>
        <option value="theme-sepia">Warm Sepia</option>
        <option value="theme-sage">Muted Sage</option>
        <option value="theme-espresso">Cozy Espresso</option>
        <option value="theme-clean-white">Clean White</option>
      </select>

      <button class="btn-action" onclick="exportPresentationHTML()" title="Download Single-File HTML Presentation">
        <i data-lucide="download" style="width: 14px; height: 14px;"></i>
        <span>Export HTML</span>
      </button>

      <button class="btn-action btn-primary-present" onclick="toggleFullscreen()" title="Present Fullscreen (Key: F)">
        <i data-lucide="play" style="width: 14px; height: 14px;"></i>
        <span>Present (F)</span>
      </button>

      <a href="../../" class="btn-action" style="text-decoration:none;">
        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
        <span>Back</span>
      </a>
    </div>
  </header>

  <div class="studio-layout">

    <!-- Left Editor Pane -->
    <aside class="editor-pane">
      <div class="input-tabs">
        <button class="input-tab active" id="tabAuto" onclick="switchInputTab('auto')">
          <i data-lucide="sparkles" style="width: 14px; height: 14px;"></i>
          <span>Auto-Generate from Text</span>
        </button>
        <button class="input-tab" id="tabManual" onclick="switchInputTab('manual')">
          <i data-lucide="edit-3" style="width: 14px; height: 14px;"></i>
          <span>Slide Code Editor</span>
        </button>
      </div>

      <!-- Tab 1: Auto Synthesizer -->
      <div class="autogen-view" id="viewAuto">
        <div class="doc-dropzone" id="docDropzone">
          <i data-lucide="file-text" style="width: 28px; height: 28px; color: var(--accent); margin-bottom: 6px;"></i>
          <div style="font-size: 14px; font-weight: 700;">Drop raw document or transcript here</div>
          <div style="font-size: 12px; color: var(--text-dim); margin-top: 2px;">Supports TXT, MD, transcripts, or notes</div>
          <input type="file" id="fileInputDoc" style="display: none;">
        </div>

        <div>
          <div style="font-size: 12px; font-weight: 700; text-transform: uppercase; color: var(--text-dim); margin-bottom: 6px;">
            Or Paste Raw Content:
          </div>
          <textarea id="rawInputText" class="raw-textarea" placeholder="Paste your interview transcript, lecture notes, project summary, or article here... The engine will intelligently synthesize structured 16:9 slides for you."></textarea>
        </div>

        <button class="btn-synthesize" onclick="synthesizeFromRawInput()">
          <i data-lucide="sparkles" style="width: 16px; height: 16px;"></i>
          <span>Synthesize 16:9 Slide Deck</span>
        </button>
      </div>

      <!-- Tab 2: Manual Slide Editor -->
      <div class="markdown-view" id="viewManual">
        <div class="editor-toolbar">
          <span style="font-size: 12px; font-weight: 700; color: var(--text-dim);">Slide Markdown (divided by ---)</span>
          <button class="btn-action" style="padding: 4px 8px; font-size: 11px;" onclick="insertSlideBreak()">+ Add Slide</button>
        </div>
        <textarea id="markdownInput" class="markdown-textarea" spellcheck="false"></textarea>
      </div>
    </aside>

    <!-- Right Slide Preview Pane -->
    <main class="preview-pane">
      <div class="slide-canvas-wrap theme-warm-alabaster" id="canvasWrap">
        <div class="slide-canvas" id="slideCanvas"></div>
      </div>

      <!-- Slide Nav Bar -->
      <div class="slide-nav-bar">
        <button class="nav-btn" id="btnPrevSlide" onclick="prevSlide()" title="Previous (Left Arrow)">
          <i data-lucide="chevron-left" style="width: 18px; height: 18px;"></i>
        </button>
        <span class="slide-counter" id="slideCounter">1 / 1</span>
        <button class="nav-btn" id="btnNextSlide" onclick="nextSlide()" title="Next (Right Arrow / Space)">
          <i data-lucide="chevron-right" style="width: 18px; height: 18px;"></i>
        </button>
      </div>
    </main>

  </div>

  <div class="toast" id="toast"></div>

  <script>
    // --- STATE ---
    let currentTheme = 'theme-warm-alabaster';
    let currentSlideIdx = 0;
    let slidesList = [];

    // Initial Starter Presentation
    const STARTER_DECK = `<!-- slide -->
:::pill EXECUTIVE PRESENTATION
# Precision Digital Tools
Crafted for focus, privacy, and speed.
:::author ManoLab Research Core • 2026

---
<!-- slide -->
:::pill STRATEGY & VISION
## The Future of Sovereign Software
Why client-side intelligence wins over centralized cloud subscriptions:

- **100% Privacy by Default:** Sensitive documents and media never leave client memory.
- **Zero Cloud Infrastructure:** Serverless execution with zero running hosting costs.
- **Microsecond Latency:** Immediate UI reactivity powered by WebAssembly.

---
<!-- slide -->
:::pill KEY ARCHITECTURE
## Core System Pillars

:::columns
:::col
### Distributed Peer-to-Peer
Direct WebRTC DataChannels with DTLS-SRTP encryption. Eliminates intermediary data harvesting.
:::
:::col
### On-Device Synthesis
Instant parsing of raw documents, voice diarization, and generative visual storytelling.
:::
:::

---
<!-- slide -->
:::pill ROADMAP
## Strategic Action Items

1. **Deploy Zero-Knowledge Utilities:** Direct peer transfer and document intelligence.
2. **Refine User Aesthetics:** Eye-comforting warm palettes with zero screen fatigue.
3. **Continuous Evolution:** Iterative polish on animation and voice engines.`;

    const markdownInput = document.getElementById('markdownInput');
    const rawInputText = document.getElementById('rawInputText');
    const docDropzone = document.getElementById('docDropzone');
    const fileInputDoc = document.getElementById('fileInputDoc');

    // --- INTELLIGENT DOCUMENT-TO-SLIDE SYNTHESIZER ---
    function synthesizeFromRawInput() {
      const raw = rawInputText.value.trim();
      if (!raw) {
        showToast('Please paste text or drop a document first!');
        return;
      }

      showToast('Synthesizing structured slide deck...');
      const synthesizedMarkdown = buildSlidesFromText(raw);
      markdownInput.value = synthesizedMarkdown;
      renderSlides();
      switchInputTab('manual');
      showToast('Slides generated successfully!');
    }

    function buildSlidesFromText(text) {
      const lines = text.split('\n').map(l => l.trim()).filter(l => l.length > 0);
      let slides = [];

      // Detect Title / Topic
      let docTitle = "Executive Briefing";
      let subtitle = "Synthesized from Source Document";
      
      if (lines.length > 0) {
        // Look for candidate title in first 3 lines
        for (let i = 0; i < Math.min(3, lines.length); i++) {
          let line = lines[i].replace(/^#+\s*/, '').replace(/^[A-Z\s]+:\s*/, '');
          if (line.length > 5 && line.length < 80) {
            docTitle = line;
            break;
          }
        }
      }

      // Check if text is Dialogue / Interview transcript
      const isDialogue = text.includes('Interviewer:') || text.includes('Subject:') || (text.match(/^[A-Z][a-zA-Z\s]+:/m) !== null);

      // Slide 1: Cover
      slides.push(`<!-- slide -->
:::pill ${isDialogue ? 'INTERVIEW INSIGHTS' : 'EXECUTIVE SUMMARY'}
# ${escapeMd(docTitle)}
${subtitle}
:::author ManoLab Intelligent Synthesis`);

      if (isDialogue) {
        // Dialogue / Transcript Parser
        const quotes = [];
        const takeaways = [];
        lines.forEach(l => {
          if (l.includes(':')) {
            const parts = l.split(':');
            const speaker = parts[0].trim();
            const speech = parts.slice(1).join(':').trim();
            if (speech.length > 40 && quotes.length < 4) {
              quotes.push(`- **${speaker}:** "${speech.slice(0, 140)}${speech.length > 140 ? '...' : ''}"`);
            }
          }
        });

        // Slide 2: Dialogue Highlights
        if (quotes.length > 0) {
          slides.push(`<!-- slide -->
:::pill FIELD TESTIMONIALS
## Key Interview Excerpts

${quotes.slice(0, 3).join('\n\n')}`);
        }

        // Slide 3: Core Topics
        slides.push(`<!-- slide -->
:::pill CORE FINDINGS
## Dialogue Synthesis & Takeaways

- **Context & Setting:** In-depth discussion exploring authentic field experiences.
- **Key Perspective:** The subject highlighted practical challenges and operational nuances.
- **Cultural & Linguistic Depth:** Native expressions preserved alongside contextual meaning.`);

      } else {
        // Document / Article Parser
        // Split into chunks of paragraphs
        const paragraphs = text.split(/\n\s*\n/).map(p => p.trim()).filter(p => p.length > 30);

        if (paragraphs.length >= 2) {
          // Slide 2: Context / Problem
          const p1 = paragraphs[0].replace(/^#+/, '').trim();
          slides.push(`<!-- slide -->
:::pill BACKGROUND & CONTEXT
## Overview & Problem Statement

${p1.slice(0, 240)}${p1.length > 240 ? '...' : ''}

- Key thematic focus identified across the source document.
- Establishes baseline metrics and operational objectives.`);
        }

        // Slide 3-4: Key Pillars (Extract sentences with strong verbs/metrics)
        const bulletPoints = [];
        lines.forEach(l => {
          if (l.startsWith('-') || l.startsWith('*') || l.match(/^\d+\./)) {
            bulletPoints.push(l.replace(/^[-*\d.]+\s*/, ''));
          } else if (l.includes('percent') || l.includes('%') || l.includes('increase') || l.includes('system') || l.includes('key')) {
            if (l.length < 150) bulletPoints.push(l);
          }
        });

        if (bulletPoints.length > 0) {
          const slice1 = bulletPoints.slice(0, 3).map(b => `- ${b}`).join('\n');
          slides.push(`<!-- slide -->
:::pill KEY FINDINGS
## Core Pillars & Discoveries

${slice1}`);
        } else {
          slides.push(`<!-- slide -->
:::pill STRATEGIC ANALYSIS
## Key Operational Pillars

- **Observation 1:** Structural alignment with core project goals.
- **Observation 2:** Rapid delivery pipeline with verifiable precision.
- **Observation 3:** High compliance standards maintained across workflow.`);
        }

        // Slide: Comparison or Two Columns
        slides.push(`<!-- slide -->
:::pill IMPACT & EXECUTION
## Implementation Architecture

:::columns
:::col
### Strengths & Momentum
Rapid execution, verified local-first integrity, zero external server dependency.
:::
:::col
### Next Horizons
Scale coverage, integrate streamlined telemetry, and deliver frictionless user experiences.
:::
:::`);
      }

      // Final Slide: Conclusion
      slides.push(`<!-- slide -->
:::pill STRATEGIC CONCLUSION
## Summary & Action Plan

1. **Review Findings:** Cross-reference synthesized points with raw source archives.
2. **Execute Next Steps:** Implement strategic recommendations systematically.
3. **Continuous Review:** Refine parameters based on real-world outcomes.`);

      return slides.join('\n\n---\n\n');
    }

    function escapeMd(str) {
      return str.replace(/[#*`_]/g, '');
    }

    // --- MARKDOWN TO SLIDE PARSER ---
    function renderSlides() {
      const raw = markdownInput.value;
      const rawSlides = raw.split(/\n---\s*\n/);
      slidesList = rawSlides.map(s => parseSlideContent(s.trim()));
      
      if (currentSlideIdx >= slidesList.length) currentSlideIdx = Math.max(0, slidesList.length - 1);
      displayCurrentSlide();
    }

    function parseSlideContent(raw) {
      let html = raw;

      // Extract pill
      html = html.replace(/:::pill\s*(.+)/g, '<div class="pill">$1</div>');
      // Extract author
      html = html.replace(/:::author\s*(.+)/g, '<div style="margin-top:1.5em; font-size:1.1vw; color:var(--text-dim); font-weight:600;">$1</div>');
      
      // Multi-column blocks
      html = html.replace(/:::columns([\s\S]*?):::/g, (match, content) => {
        const cols = content.split(/:::col/).filter(c => c.trim().length > 0);
        return `<div class="slide-cols">${cols.map(c => `<div class="slide-card-box">${parseMarkdownBasics(c.trim())}</div>`).join('')}</div>`;
      });

      html = parseMarkdownBasics(html);
      return html;
    }

    function parseMarkdownBasics(text) {
      let t = text;
      // Headers
      t = t.replace(/^#\s+(.+)$/gm, '<h1>$1</h1>');
      t = t.replace(/^##\s+(.+)$/gm, '<h2>$1</h2>');
      t = t.replace(/^###\s+(.+)$/gm, '<h3>$1</h3>');

      // Bold & Italic
      t = t.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      t = t.replace(/\*(.+?)\*/g, '<em>$1</em>');

      // Bullets
      t = t.replace(/^\-\s+(.+)$/gm, '<li>$1</li>');
      t = t.replace(/(<li>.*<\/li>)/s, '<ul style="padding-left: 1.5em; margin: 0.8em 0;">$1</ul>');

      // Numbered
      t = t.replace(/^\d+\.\s+(.+)$/gm, '<li style="margin-bottom:0.4em;">$1</li>');

      // Paragraphs
      t = t.replace(/^(?!<[h|u|o|l|d|p])(.*[^\n])$/gm, '<p>$1</p>');
      return t;
    }

    function displayCurrentSlide() {
      const canvas = document.getElementById('slideCanvas');
      if (slidesList.length === 0) {
        canvas.innerHTML = '<h1>Empty Presentation</h1>';
        return;
      }
      canvas.innerHTML = slidesList[currentSlideIdx];
      document.getElementById('slideCounter').textContent = `${currentSlideIdx + 1} / ${slidesList.length}`;
      document.getElementById('btnPrevSlide').disabled = currentSlideIdx <= 0;
      document.getElementById('btnNextSlide').disabled = currentSlideIdx >= slidesList.length - 1;
    }

    function nextSlide() {
      if (currentSlideIdx < slidesList.length - 1) {
        currentSlideIdx++;
        displayCurrentSlide();
      }
    }

    function prevSlide() {
      if (currentSlideIdx > 0) {
        currentSlideIdx--;
        displayCurrentSlide();
      }
    }

    function switchInputTab(tab) {
      document.getElementById('tabAuto').classList.toggle('active', tab === 'auto');
      document.getElementById('tabManual').classList.toggle('active', tab === 'manual');
      document.getElementById('viewAuto').style.display = tab === 'auto' ? 'flex' : 'none';
      document.getElementById('viewManual').style.display = tab === 'manual' ? 'flex' : 'none';
    }

    function changeTheme(themeClass) {
      const wrap = document.getElementById('canvasWrap');
      wrap.className = 'slide-canvas-wrap ' + themeClass;
      currentTheme = themeClass;
      showToast('Theme updated');
    }

    function insertSlideBreak() {
      markdownInput.value += '\n\n---\n<!-- slide -->\n:::pill TOPIC\n## New Slide Heading\n\n- Point 1\n- Point 2\n';
      renderSlides();
      currentSlideIdx = slidesList.length - 1;
      displayCurrentSlide();
    }

    // Fullscreen Presenter
    function toggleFullscreen() {
      const wrap = document.getElementById('canvasWrap');
      if (!document.fullscreenElement) {
        wrap.requestFullscreen().catch(err => {
          wrap.classList.toggle('present-mode');
        });
      } else {
        document.exitFullscreen();
      }
    }

    document.addEventListener('fullscreenchange', () => {
      const wrap = document.getElementById('canvasWrap');
      if (document.fullscreenElement) {
        wrap.classList.add('present-mode');
      } else {
        wrap.classList.remove('present-mode');
      }
    });

    // Keyboard Navigation
    document.addEventListener('keydown', (e) => {
      if (document.activeElement === markdownInput || document.activeElement === rawInputText) return;
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        e.preventDefault();
        nextSlide();
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        e.preventDefault();
        prevSlide();
      } else if (e.key.toLowerCase() === 'f') {
        e.preventDefault();
        toggleFullscreen();
      }
    });

    // File Drag and Drop for Raw Document
    docDropzone.addEventListener('click', () => fileInputDoc.click());
    docDropzone.addEventListener('dragover', (e) => { e.preventDefault(); docDropzone.style.borderColor = 'var(--accent)'; });
    docDropzone.addEventListener('dragleave', () => { docDropzone.style.borderColor = '#d8d0c2'; });
    docDropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      docDropzone.style.borderColor = '#d8d0c2';
      if (e.dataTransfer.files.length > 0) loadDocFile(e.dataTransfer.files[0]);
    });

    fileInputDoc.addEventListener('change', (e) => {
      if (e.target.files.length > 0) loadDocFile(e.target.files[0]);
    });

    function loadDocFile(file) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        rawInputText.value = ev.target.result;
        showToast('Document loaded: ' + file.name);
        synthesizeFromRawInput();
      };
      reader.readAsText(file);
    }

    // Export Self-Contained Presentation HTML
    function exportPresentationHTML() {
      const htmlContent = `<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SlideCraft Presentation</title>
  <style>
    body { margin: 0; background: #faf8f5; font-family: 'Plus Jakarta Sans', sans-serif; height: 100vh; display: flex; align-items: center; justify-content: center; }
    .wrap { width: 90vw; max-width: 1200px; aspect-ratio: 16/9; background: #fff; box-shadow: 0 10px 40px rgba(0,0,0,0.1); border-radius: 12px; padding: 5%; display: flex; flex-direction: column; justify-content: center; box-sizing: border-box; }
    h1 { font-size: 3vw; margin-bottom: 0.5em; }
    h2 { font-size: 2.2vw; color: #c25e38; margin-bottom: 0.5em; }
    p, li { font-size: 1.4vw; color: #44403c; line-height: 1.6; }
  </style>
</head>
<body>
  <div class="wrap">
    ${slidesList.join('<div style="page-break-after: always; margin-top: 30px;"></div>')}
  </div>
</body>
</html>`;
      const blob = new Blob([htmlContent], { type: 'text/html' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'presentation.html';
      a.click();
      showToast('Exported presentation.html');
    }

    function showToast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2800);
    }

    markdownInput.addEventListener('input', renderSlides);

    // Initial Load
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) lucide.createIcons();
      markdownInput.value = STARTER_DECK;
      renderSlides();
    });
  </script>
</body>
</html>
