<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Classic Brick Breaker — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%233b82f6%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0b0f19;
      --card-bg: #111827;
      --border: #1f2937;
      --text: #f9fafb;
      --text-dim: #9ca3af;
      --accent: #3b82f6;
    }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: none;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #0d121f;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.45rem 0.9rem;
      background: #1e293b;
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 0.82rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #334155; color: #fff; }
    .game-container {
      max-width: 500px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .score-item { display: flex; flex-direction: column; }
    .score-lbl { font-size: 0.7rem; color: var(--text-dim); text-transform: uppercase; font-weight: 600; }
    .score-val { font-size: 1.4rem; font-weight: 700; color: #60a5fa; }
    .canvas-wrap {
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 2px solid var(--border);
      background: #030712;
      box-shadow: 0 15px 30px rgba(0, 0, 0, 0.5);
    }
    canvas {
      display: block;
      width: 100%;
      height: 440px;
      background: #030712;
      cursor: ew-resize;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(3, 7, 18, 0.88);
      backdrop-filter: blur(6px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      padding: 2rem;
      text-align: center;
      z-index: 10;
    }
    .overlay.hidden { display: none; }
    .overlay-title { font-size: 1.8rem; font-weight: 800; }
    .btn-action {
      background: #3b82f6;
      color: #fff;
      font-weight: 800;
      font-size: 0.95rem;
      padding: 0.75rem 1.8rem;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: transform 0.15s, background 0.15s;
    }
    .btn-action:hover { transform: scale(1.03); background: #2563eb; }
    .hint-bar {
      font-size: 0.8rem;
      color: var(--text-dim);
      text-align: center;
    }
    .kbd {
      background: #1e293b;
      padding: 0.15rem 0.45rem;
      border-radius: 6px;
      border: 1px solid var(--border);
      font-family: 'JetBrains Mono', monospace;
      color: #fff;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #60a5fa;">🕹️</span>
      <span>Brick Breaker</span>
    </div>
    <div style="width: 80px;"></div>
  </header>

  <div class="game-container">
    <div class="scoreboard">
      <div class="score-item">
        <span class="score-lbl">Score</span>
        <span id="scoreVal" class="score-val">0</span>
      </div>
      <div class="score-item" style="align-items: center;">
        <span class="score-lbl">Lives</span>
        <span id="livesVal" class="score-val" style="color: #ef4444;">❤️❤️❤️</span>
      </div>
      <div class="score-item" style="align-items: flex-end;">
        <span class="score-lbl">High Score</span>
        <span id="bestVal" class="score-val" style="color: #10b981;">0</span>
      </div>
    </div>

    <div class="canvas-wrap">
      <canvas id="gameCanvas" width="440" height="440"></canvas>

      <!-- Start Overlay -->
      <div id="startOverlay" class="overlay">
        <div style="font-size: 2.5rem;">🕹️</div>
        <div class="overlay-title">Classic Brick Breaker</div>
        <p style="color: var(--text-dim); font-size: 0.88rem; max-width: 280px;">
          Move paddle left and right to bounce the ball and smash all the colored bricks.
        </p>
        <button id="startBtn" class="btn-action">
          <i data-lucide="play" style="width: 16px; height: 16px;"></i>
          <span>PLAY NOW</span>
        </button>
      </div>

      <!-- Game Over Overlay -->
      <div id="gameOverOverlay" class="overlay hidden">
        <div style="font-size: 2.5rem;" id="endEmoji">💥</div>
        <div class="overlay-title" id="endTitle" style="color: #ef4444;">Game Over</div>
        <div style="font-family: 'JetBrains Mono'; font-size: 1.1rem; color: #fff;">
          Final Score: <span id="finalScore" style="color: #60a5fa; font-weight: 700;">0</span>
        </div>
        <button id="restartBtn" class="btn-action">
          <i data-lucide="rotate-ccw" style="width: 16px; height: 16px;"></i>
          <span>PLAY AGAIN</span>
        </button>
      </div>
    </div>

    <div class="hint-bar">
      Use <span class="kbd">MOUSE</span> / <span class="kbd">TOUCH</span> or <span class="kbd">LEFT / RIGHT ARROWS</span> to move paddle
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreVal = document.getElementById('scoreVal');
    const livesVal = document.getElementById('livesVal');
    const bestVal = document.getElementById('bestVal');
    const finalScore = document.getElementById('finalScore');
    const startOverlay = document.getElementById('startOverlay');
    const gameOverOverlay = document.getElementById('gameOverOverlay');
    const startBtn = document.getElementById('startBtn');
    const restartBtn = document.getElementById('restartBtn');
    const endTitle = document.getElementById('endTitle');
    const endEmoji = document.getElementById('endEmoji');

    let bestScore = parseInt(localStorage.getItem('mano_breakout_best') || '0', 10);
    bestVal.textContent = bestScore;

    // Audio
    let audioCtx = null;
    function playTone(freq = 440, duration = 0.05) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }

    // Paddle
    const paddle = {
      w: 80,
      h: 12,
      x: 180,
      y: 410,
      speed: 7
    };

    // Ball
    const ball = {
      x: 220,
      y: 390,
      r: 6,
      vx: 3.5,
      vy: -3.5,
      speed: 4.5
    };

    // Bricks
    const brickRows = 5;
    const brickCols = 8;
    const brickW = 46;
    const brickH = 16;
    const brickPad = 6;
    const brickOffsetTop = 40;
    const brickOffsetLeft = 14;
    const rowColors = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];

    let bricks = [];
    let score = 0;
    let lives = 3;
    let state = 'IDLE'; // IDLE, RUNNING, GAMEOVER, WON
    let keys = { left: false, right: false };

    function initBricks() {
      bricks = [];
      for (let r = 0; r < brickRows; r++) {
        bricks[r] = [];
        for (let c = 0; c < brickCols; c++) {
          bricks[r][c] = { x: 0, y: 0, status: 1, color: rowColors[r] };
        }
      }
    }

    function resetGame() {
      initBricks();
      score = 0;
      lives = 3;
      scoreVal.textContent = '0';
      livesVal.textContent = '❤️❤️❤️';
      paddle.x = (canvas.width - paddle.w) / 2;
      resetBall();
      state = 'RUNNING';
      startOverlay.classList.add('hidden');
      gameOverOverlay.classList.add('hidden');
    }

    function resetBall() {
      ball.x = paddle.x + paddle.w / 2;
      ball.y = paddle.y - 10;
      ball.vx = (Math.random() > 0.5 ? 1 : -1) * 3.5;
      ball.vy = -3.5;
    }

    function endGame(won) {
      state = won ? 'WON' : 'GAMEOVER';
      playTone(won ? 880 : 180, 0.3);
      if (score > bestScore) {
        bestScore = score;
        localStorage.setItem('mano_breakout_best', bestScore);
        bestVal.textContent = bestScore;
      }
      finalScore.textContent = score;
      endTitle.textContent = won ? 'You Won!' : 'Game Over';
      endTitle.style.color = won ? '#10b981' : '#ef4444';
      endEmoji.textContent = won ? '🏆' : '💥';
      gameOverOverlay.classList.remove('hidden');
    }

    // Input
    window.addEventListener('keydown', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = true;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = true;
      if (e.code === 'Space' && (state === 'IDLE' || state === 'GAMEOVER' || state === 'WON')) resetGame();
    });

    window.addEventListener('keyup', (e) => {
      if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.left = false;
      if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.right = false;
    });

    canvas.addEventListener('pointermove', (e) => {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.clientX;
      const x = ((clientX - rect.left) / rect.width) * canvas.width;
      paddle.x = Math.max(0, Math.min(canvas.width - paddle.w, x - paddle.w / 2));
    });

    startBtn.addEventListener('click', resetGame);
    restartBtn.addEventListener('click', resetGame);

    function update() {
      if (state !== 'RUNNING') return;

      // Move paddle with keys
      if (keys.left) paddle.x = Math.max(0, paddle.x - paddle.speed);
      if (keys.right) paddle.x = Math.min(canvas.width - paddle.w, paddle.x + paddle.speed);

      // Ball move
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Wall bounce
      if (ball.x - ball.r <= 0 || ball.x + ball.r >= canvas.width) {
        ball.vx = -ball.vx;
        playTone(350, 0.03);
      }
      if (ball.y - ball.r <= 0) {
        ball.vy = -ball.vy;
        playTone(350, 0.03);
      }

      // Bottom death
      if (ball.y + ball.r >= canvas.height) {
        lives--;
        playTone(180, 0.15);
        if (lives <= 0) {
          livesVal.textContent = '💀';
          endGame(false);
          return;
        } else {
          livesVal.textContent = '❤️'.repeat(lives);
          resetBall();
        }
      }

      // Paddle bounce
      if (
        ball.y + ball.r >= paddle.y &&
        ball.y - ball.r <= paddle.y + paddle.h &&
        ball.x >= paddle.x &&
        ball.x <= paddle.x + paddle.w
      ) {
        const hitPoint = (ball.x - (paddle.x + paddle.w / 2)) / (paddle.w / 2);
        ball.vx = hitPoint * 4.5;
        ball.vy = -Math.abs(ball.vy);
        playTone(520, 0.04);
      }

      // Brick collision
      let activeCount = 0;
      for (let r = 0; r < brickRows; r++) {
        for (let c = 0; c < brickCols; c++) {
          const b = bricks[r][c];
          if (b.status === 1) {
            activeCount++;
            const bx = c * (brickW + brickPad) + brickOffsetLeft;
            const by = r * (brickH + brickPad) + brickOffsetTop;
            b.x = bx;
            b.y = by;

            if (
              ball.x > bx &&
              ball.x < bx + brickW &&
              ball.y > by &&
              ball.y < by + brickH
            ) {
              ball.vy = -ball.vy;
              b.status = 0;
              score += (brickRows - r) * 10;
              scoreVal.textContent = score;
              playTone(600 + (brickRows - r) * 60, 0.04);
            }
          }
        }
      }

      if (activeCount === 0) {
        endGame(true);
      }
    }

    function draw() {
      ctx.fillStyle = '#030712';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Bricks
      for (let r = 0; r < brickRows; r++) {
        for (let c = 0; c < brickCols; c++) {
          const b = bricks[r] ? bricks[r][c] : null;
          if (b && b.status === 1) {
            const bx = c * (brickW + brickPad) + brickOffsetLeft;
            const by = r * (brickH + brickPad) + brickOffsetTop;
            ctx.fillStyle = b.color;
            ctx.beginPath();
            ctx.roundRect(bx, by, brickW, brickH, 3);
            ctx.fill();
          }
        }
      }

      // Paddle
      ctx.fillStyle = '#f1f5f9';
      ctx.beginPath();
      ctx.roundRect(paddle.x, paddle.y, paddle.w, paddle.h, 6);
      ctx.fill();

      // Ball
      ctx.fillStyle = '#60a5fa';
      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
      ctx.fill();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    initBricks();
    loop();
  </script>
</body>
</html>
