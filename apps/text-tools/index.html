<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Text Morph — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090a0d;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .container {
      max-width: 1000px;
      margin: 2rem auto;
      padding: 0 1.5rem;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    .stats-bar {
      display: flex;
      gap: 1.5rem;
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0.75rem 1.25rem;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #7a8294;
    }
    .stats-bar span strong { color: #c8ff00; }
    .actions-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .btn-tool {
      padding: 0.45rem 0.9rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-tool:hover { background: #242934; border-color: #c8ff00; color: #c8ff00; }
    .textarea-box {
      flex: 1;
      min-height: 380px;
      width: 100%;
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.25rem;
      color: #f5f5f0;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
      resize: vertical;
      outline: none;
    }
    .textarea-box:focus { border-color: #c8ff00; }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">🔤</span>
      <span>Text Morph & Data Swiss-Army Knife</span>
    </div>
    <button onclick="copyText()" style="padding: 0.4rem 0.85rem; border-radius: 10px; background: #c8ff00; color: #090a0d; font-weight: 800; font-size: 0.8rem; border: none; cursor: pointer;">
      Copy Output
    </button>
  </header>

  <div class="container">
    <div class="stats-bar">
      <span>Words: <strong id="wordCount">0</strong></span>
      <span>Characters: <strong id="charCount">0</strong></span>
      <span>Lines: <strong id="lineCount">0</strong></span>
      <span>Read Time: <strong id="readTime">0 min</strong></span>
    </div>

    <div class="actions-bar">
      <button class="btn-tool" onclick="transform('uppercase')">UPPERCASE</button>
      <button class="btn-tool" onclick="transform('lowercase')">lowercase</button>
      <button class="btn-tool" onclick="transform('titlecase')">Title Case</button>
      <button class="btn-tool" onclick="transform('trim')">Clean Extra Spaces</button>
      <button class="btn-tool" onclick="transform('json')">Pretty JSON</button>
      <button class="btn-tool" onclick="transform('dedupe')">Dedupe Lines</button>
      <button class="btn-tool" onclick="transform('b64encode')">Base64 Encode</button>
      <button class="btn-tool" onclick="transform('b64decode')">Base64 Decode</button>
      <button class="btn-tool" onclick="transform('clear')" style="color: #f43f5e;">Clear</button>
    </div>

    <textarea id="mainText" class="textarea-box" placeholder="Type or paste any text or JSON here to clean, convert, or format..." oninput="updateStats()"></textarea>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();
    const txt = document.getElementById('mainText');

    function updateStats() {
      const v = txt.value;
      const words = v.trim() ? v.trim().split(/\s+/).length : 0;
      document.getElementById('wordCount').textContent = words;
      document.getElementById('charCount').textContent = v.length;
      document.getElementById('lineCount').textContent = v ? v.split('\n').length : 0;
      document.getElementById('readTime').textContent = Math.ceil(words / 200) + ' min';
    }

    function transform(type) {
      let v = txt.value;
      if (type === 'uppercase') txt.value = v.toUpperCase();
      else if (type === 'lowercase') txt.value = v.toLowerCase();
      else if (type === 'titlecase') txt.value = v.replace(/\b\w/g, l => l.toUpperCase());
      else if (type === 'trim') txt.value = v.replace(/[ \t]+/g, ' ').replace(/^\s+|\s+$/gm, '');
      else if (type === 'dedupe') txt.value = [...new Set(v.split('\n'))].join('\n');
      else if (type === 'clear') txt.value = '';
      else if (type === 'b64encode') {
        try { txt.value = btoa(unescape(encodeURIComponent(v))); } catch(e) { alert("Encoding error: " + e.message); }
      }
      else if (type === 'b64decode') {
        try { txt.value = decodeURIComponent(escape(atob(v))); } catch(e) { alert("Invalid Base64: " + e.message); }
      }
      else if (type === 'json') {
        try {
          const obj = JSON.parse(v);
          txt.value = JSON.stringify(obj, null, 2);
        } catch(e) {
          alert("Invalid JSON: " + e.message);
        }
      }
      updateStats();
    }

    function copyText() {
      navigator.clipboard.writeText(txt.value).then(() => {
        alert("Text copied to clipboard!");
      });
    }
  </script>
</body>
</html>
