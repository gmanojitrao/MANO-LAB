<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palette Studio — MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #090a0d;
      color: #f5f5f0;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      user-select: none;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
      z-index: 10;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .title-box { display: flex; align-items: center; gap: 0.6rem; font-weight: 800; }
    .gen-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.55rem 1.25rem;
      background: #c8ff00;
      color: #090a0d;
      font-weight: 800;
      font-size: 0.85rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 2px 12px rgba(200, 255, 0, 0.3);
      transition: transform 0.15s, background 0.15s;
    }
    .gen-btn:hover { background: #d8ff33; transform: scale(1.03); }
    .gen-btn:active { transform: scale(0.97); }
    .hint { font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace; }
    
    /* Palette Columns */
    .palette-stage {
      flex: 1;
      display: flex;
      width: 100%;
      height: 100%;
    }
    .color-col {
      flex: 1;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 2.5rem 1.25rem;
      position: relative;
      cursor: pointer;
      transition: flex 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .color-col:hover { flex: 1.25; }
    .color-info {
      text-align: center;
      opacity: 0.95;
      background: rgba(0, 0, 0, 0.25);
      backdrop-filter: blur(8px);
      padding: 0.75rem;
      border-radius: 12px;
      transition: transform 0.15s;
    }
    .color-col:hover .color-info { transform: translateY(-4px); }
    .hex-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1.3rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 0.25rem;
    }
    .color-name { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; opacity: 0.8; }
    .col-actions {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
    }
    .icon-btn {
      width: 2.5rem;
      height: 2.5rem;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.15s;
    }
    .icon-btn:hover { background: rgba(0, 0, 0, 0.6); transform: scale(1.1); }
    .icon-btn.locked { background: #c8ff00; color: #090a0d; border-color: #c8ff00; }
    
    /* Copied Toast */
    .toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      background: #0d0f14;
      color: #c8ff00;
      border: 1px solid #c8ff00;
      padding: 0.65rem 1.4rem;
      border-radius: 30px;
      font-weight: 700;
      font-size: 0.85rem;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6);
      opacity: 0;
      pointer-events: none;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 100;
      font-family: 'JetBrains Mono', monospace;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>

  <header>
    <div style="display: flex; align-items: center; gap: 1rem;">
      <a href="../../" class="back-btn">
        <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
        <span>MANO-LAB</span>
      </a>
      <div class="title-box">
        <span style="color: #c8ff00;">🎨</span>
        <span>Palette Studio</span>
      </div>
    </div>

    <div style="display: flex; align-items: center; gap: 1.25rem;">
      <span class="hint">Press SPACEBAR or click Generate</span>
      <button class="gen-btn" onclick="generatePalette()">
        <i data-lucide="refresh-cw" style="width: 14px; height: 14px;"></i>
        <span>Generate</span>
      </button>
    </div>
  </header>

  <div class="palette-stage" id="paletteContainer"></div>

  <div class="toast" id="toast">Copied to clipboard!</div>

  <script>
    let palette = [
      { hex: '#0B0D12', locked: false },
      { hex: '#1E232D', locked: false },
      { hex: '#C8FF00', locked: false },
      { hex: '#38BDF8', locked: false },
      { hex: '#F6F6F0', locked: false }
    ];

    function getRandomColor() {
      const letters = '0123456789ABCDEF';
      let color = '#';
      for (let i = 0; i < 6; i++) {
        color += letters[Math.floor(Math.random() * 16)];
      }
      return color;
    }

    function isLight(hex) {
      const rgb = parseInt(hex.slice(1), 16);
      const r = (rgb >> 16) & 0xff;
      const g = (rgb >>  8) & 0xff;
      const b = (rgb >>  0) & 0xff;
      const luma = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      return luma > 140;
    }

    function renderPalette() {
      const container = document.getElementById('paletteContainer');
      container.innerHTML = '';

      palette.forEach((item, idx) => {
        const col = document.createElement('div');
        col.className = 'color-col';
        col.style.backgroundColor = item.hex;
        const textColor = isLight(item.hex) ? '#090a0d' : '#f5f5f0';
        col.style.color = textColor;

        col.innerHTML = `
          <div class="col-actions">
            <button class="icon-btn ${item.locked ? 'locked' : ''}" onclick="toggleLock(${idx}, event)" title="${item.locked ? 'Unlock Color' : 'Lock Color'}">
              <i data-lucide="${item.locked ? 'lock' : 'unlock'}" style="width: 16px; height: 16px;"></i>
            </button>
          </div>
          <div class="color-info" onclick="copyHex('${item.hex}', event)">
            <div class="hex-code">${item.hex}</div>
            <div class="color-name">Click to Copy</div>
          </div>
        `;

        container.appendChild(col);
      });

      if (window.lucide) window.lucide.createIcons();
    }

    function generatePalette() {
      palette.forEach(item => {
        if (!item.locked) {
          item.hex = getRandomColor();
        }
      });
      renderPalette();
    }

    function toggleLock(idx, e) {
      e.stopPropagation();
      palette[idx].locked = !palette[idx].locked;
      renderPalette();
    }

    function copyHex(hex, e) {
      e.stopPropagation();
      navigator.clipboard.writeText(hex).then(() => {
        const toast = document.getElementById('toast');
        toast.textContent = `Copied ${hex} to clipboard!`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
      });
    }

    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        generatePalette();
      }
    });

    generatePalette();
  </script>
</body>
</html>
