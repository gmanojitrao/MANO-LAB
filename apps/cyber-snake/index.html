<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cyber Snake — MANO-LAB Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #08090c;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: manipulation;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .game-area {
      max-width: 520px;
      margin: 1.5rem auto;
      padding: 0 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }
    .scoreboard {
      width: 100%;
      display: flex;
      justify-content: space-between;
      background: #12141a;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 0.75rem 1.5rem;
      font-family: 'JetBrains Mono', monospace;
    }
    .score-item { display: flex; flex-direction: column; }
    .score-lbl { font-size: 0.7rem; color: #7a8294; text-transform: uppercase; }
    .score-val { font-size: 1.4rem; font-weight: 800; color: #c8ff00; }
    
    .canvas-box {
      width: 100%;
      aspect-ratio: 1;
      background: #040507;
      border: 2px solid rgba(200, 255, 0, 0.3);
      border-radius: 20px;
      box-shadow: 0 0 30px rgba(200, 255, 0, 0.1);
      position: relative;
      overflow: hidden;
    }
    #snakeCanvas { width: 100%; height: 100%; display: block; }
    
    .game-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 5, 7, 0.85);
      backdrop-filter: blur(8px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 1rem;
      border-radius: 18px;
    }
    .game-overlay.hidden { display: none; }
    .btn-play {
      padding: 0.85rem 2rem;
      background: #c8ff00;
      color: #08090c;
      font-weight: 800;
      font-size: 1.1rem;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(200, 255, 0, 0.4);
      transition: transform 0.15s;
    }
    .btn-play:hover { transform: scale(1.05); }

    /* Mobile D-pad */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 55px);
      grid-template-rows: repeat(2, 55px);
      gap: 6px;
      margin-top: 0.5rem;
    }
    @media (min-width: 768px) { .d-pad { display: none; } }
    .d-btn {
      background: #181b24;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      cursor: pointer;
    }
    .d-btn:active { background: #c8ff00; color: #08090c; }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">🐍</span>
      <span>Cyber Snake Arcade</span>
    </div>
    <div style="font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace;">Controls: WASD / Arrows</div>
  </header>

  <div class="game-area">
    <div class="scoreboard">
      <div class="score-item">
        <span class="score-lbl">Score</span>
        <span class="score-val" id="scoreVal">0</span>
      </div>
      <div class="score-item" style="text-align: right;">
        <span class="score-lbl">High Score</span>
        <span class="score-val" id="highScoreVal" style="color: #38bdf8;">0</span>
      </div>
    </div>

    <div class="canvas-box">
      <canvas id="snakeCanvas" width="400" height="400"></canvas>
      <div class="game-overlay" id="overlay">
        <div style="font-size: 2.5rem; margin-bottom: -0.5rem;">🐍</div>
        <h2 id="overlayTitle" style="font-size: 1.8rem; font-weight: 800; letter-spacing: -0.03em;">CYBER SNAKE</h2>
        <p id="overlayDesc" style="color: #7a8294; font-size: 0.9rem;">Eat neon orbs, dodge walls, set the record!</p>
        <button class="btn-play" onclick="startGame()">PRESS START</button>
      </div>
    </div>

    <!-- On-screen D-pad for mobile -->
    <div class="d-pad">
      <div></div>
      <button class="d-btn" onclick="setDir(0, -1)">▲</button>
      <div></div>
      <button class="d-btn" onclick="setDir(-1, 0)">◀</button>
      <button class="d-btn" onclick="setDir(0, 1)">▼</button>
      <button class="d-btn" onclick="setDir(1, 0)">▶</button>
    </div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    const canvas = document.getElementById('snakeCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    const tileCount = 20;

    let snake = [];
    let food = { x: 15, y: 15 };
    let dx = 0;
    let dy = 0;
    let nextDx = 0;
    let nextDy = 0;
    let score = 0;
    let highScore = parseInt(localStorage.getItem('mano_snake_hi') || '0', 10);
    let gameLoop = null;
    let particles = [];
    let audioCtx = null;

    document.getElementById('highScoreVal').textContent = highScore;

    function playBeep(freq, type = 'sine', duration = 0.08) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch(e) {}
    }

    function startGame() {
      document.getElementById('overlay').classList.add('hidden');
      snake = [
        { x: 10, y: 10 },
        { x: 10, y: 11 },
        { x: 10, y: 12 }
      ];
      dx = 0;
      dy = -1;
      nextDx = 0;
      nextDy = -1;
      score = 0;
      particles = [];
      document.getElementById('scoreVal').textContent = '0';
      spawnFood();

      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 90);
      playBeep(600, 'triangle', 0.1);
    }

    function spawnFood() {
      food = {
        x: Math.floor(Math.random() * tileCount),
        y: Math.floor(Math.random() * tileCount)
      };
      // Don't spawn on snake
      if (snake.some(s => s.x === food.x && s.y === food.y)) spawnFood();
    }

    function spawnSparks(x, y) {
      for (let i = 0; i < 12; i++) {
        particles.push({
          x: x * gridSize + 10,
          y: y * gridSize + 10,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6,
          life: 1,
          color: Math.random() > 0.5 ? '#c8ff00' : '#f43f5e'
        });
      }
    }

    function update() {
      dx = nextDx;
      dy = nextDy;

      const head = { x: snake[0].x + dx, y: snake[0].y + dy };

      // Wall collision
      if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
        gameOver();
        return;
      }

      // Self collision
      if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
        gameOver();
        return;
      }

      snake.unshift(head);

      // Check food
      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('scoreVal').textContent = score;
        spawnSparks(food.x, food.y);
        playBeep(900 + score * 10, 'sine', 0.08);
        if (score > highScore) {
          highScore = score;
          localStorage.setItem('mano_snake_hi', highScore);
          document.getElementById('highScoreVal').textContent = highScore;
        }
        spawnFood();
      } else {
        snake.pop();
      }

      draw();
    }

    function gameOver() {
      clearInterval(gameLoop);
      playBeep(220, 'sawtooth', 0.3);
      document.getElementById('overlayTitle').textContent = 'GAME OVER';
      document.getElementById('overlayDesc').textContent = `Final Score: ${score} points!`;
      document.getElementById('overlay').classList.remove('hidden');
    }

    function draw() {
      // Clear
      ctx.fillStyle = '#040507';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Draw Grid lines subtle
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
      for (let i = 0; i < canvas.width; i += gridSize) {
        ctx.beginPath();
        ctx.moveTo(i, 0); ctx.lineTo(i, canvas.height);
        ctx.moveTo(0, i); ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }

      // Draw Food (pulsing neon star)
      ctx.fillStyle = '#f43f5e';
      ctx.shadowColor = '#f43f5e';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(food.x * gridSize + 10, food.y * gridSize + 10, 7, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // Draw Snake
      snake.forEach((part, index) => {
        const isHead = index === 0;
        ctx.fillStyle = isHead ? '#ffffff' : '#c8ff00';
        ctx.shadowColor = '#c8ff00';
        ctx.shadowBlur = isHead ? 14 : 6;
        ctx.beginPath();
        ctx.roundRect(part.x * gridSize + 2, part.y * gridSize + 2, gridSize - 4, gridSize - 4, isHead ? 6 : 4);
        ctx.fill();
      });
      ctx.shadowBlur = 0;

      // Draw Particles
      particles.forEach((p, idx) => {
        p.x += p.vx;
        p.y += p.vy;
        p.life -= 0.05;
        if (p.life <= 0) {
          particles.splice(idx, 1);
        } else {
          ctx.fillStyle = p.color;
          ctx.beginPath();
          ctx.arc(p.x, p.y, 2.5 * p.life, 0, Math.PI * 2);
          ctx.fill();
        }
      });
    }

    function setDir(newDx, newDy) {
      if (newDx !== 0 && dx === -newDx) return;
      if (newDy !== 0 && dy === -newDy) return;
      nextDx = newDx;
      nextDy = newDy;
      playBeep(450, 'sine', 0.02);
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); setDir(0, -1); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); setDir(0, 1); }
      else if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); setDir(-1, 0); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); setDir(1, 0); }
    });
  </script>
</body>
</html>
