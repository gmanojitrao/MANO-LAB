<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2048 Neon — MANO-LAB Games</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700;800&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: #08090c;
      color: #f5f5f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
      touch-action: none;
    }
    header {
      height: 4rem;
      padding: 0 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      background: #0d0f14;
    }
    .back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.4rem 0.85rem;
      background: #181b22;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      color: #f5f5f0;
      font-size: 0.8rem;
      font-weight: 700;
      text-decoration: none;
      transition: all 0.15s;
    }
    .back-btn:hover { background: #222630; border-color: #c8ff00; }
    .container {
      max-width: 440px;
      margin: 2rem auto;
      padding: 0 1rem;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-boxes {
      display: flex;
      gap: 0.6rem;
    }
    .s-box {
      background: #141720;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 0.5rem 0.9rem;
      text-align: center;
      min-width: 80px;
      font-family: 'JetBrains Mono', monospace;
    }
    .s-lbl { font-size: 0.65rem; color: #7a8294; text-transform: uppercase; }
    .s-val { font-size: 1.25rem; font-weight: 800; color: #c8ff00; }
    .grid-container {
      width: 100%;
      aspect-ratio: 1;
      background: #12141a;
      border: 2px solid rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      padding: 12px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      grid-template-rows: repeat(4, 1fr);
      gap: 10px;
      box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    }
    .tile {
      background: rgba(255, 255, 255, 0.04);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.6rem;
      font-weight: 800;
      font-family: 'JetBrains Mono', monospace;
      transition: transform 0.1s ease, background 0.15s ease;
    }
    .tile-2 { background: #1a1e29; color: #f5f5f0; }
    .tile-4 { background: #222938; color: #f5f5f0; }
    .tile-8 { background: #0369a1; color: #fff; box-shadow: 0 0 10px rgba(3,105,161,0.4); }
    .tile-16 { background: #0284c7; color: #fff; box-shadow: 0 0 12px rgba(2,132,199,0.5); }
    .tile-32 { background: #059669; color: #fff; box-shadow: 0 0 14px rgba(5,150,105,0.5); }
    .tile-64 { background: #10b981; color: #08090c; box-shadow: 0 0 16px rgba(16,185,129,0.6); }
    .tile-128 { background: #d97706; color: #fff; box-shadow: 0 0 18px rgba(217,119,6,0.6); }
    .tile-256 { background: #f59e0b; color: #08090c; box-shadow: 0 0 20px rgba(245,158,11,0.7); }
    .tile-512 { background: #e11d48; color: #fff; box-shadow: 0 0 22px rgba(225,29,72,0.8); }
    .tile-1024 { background: #8b5cf6; color: #fff; box-shadow: 0 0 26px rgba(139,92,246,0.9); }
    .tile-2048 { background: #c8ff00; color: #08090c; box-shadow: 0 0 30px #c8ff00; font-size: 1.4rem; }
    
    .btn-new {
      padding: 0.6rem 1.25rem;
      background: #c8ff00;
      color: #08090c;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <a href="../../" class="back-btn">
      <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
      <span>MANO-LAB</span>
    </a>
    <div style="font-weight: 800; display: flex; align-items: center; gap: 0.5rem;">
      <span style="color: #c8ff00;">🎲</span>
      <span>2048 Neon Lab</span>
    </div>
    <div style="font-size: 0.75rem; color: #7a8294; font-family: 'JetBrains Mono', monospace;">Swipe / Arrow Keys</div>
  </header>

  <div class="container">
    <div class="top-bar">
      <button class="btn-new" onclick="initGame()">New Game</button>
      <div class="score-boxes">
        <div class="s-box">
          <div class="s-lbl">Score</div>
          <div class="s-val" id="score">0</div>
        </div>
        <div class="s-box">
          <div class="s-lbl">Best</div>
          <div class="s-val" id="bestScore" style="color: #38bdf8;">0</div>
        </div>
      </div>
    </div>

    <div class="grid-container" id="grid"></div>
  </div>

  <script>
    if (window.lucide) window.lucide.createIcons();

    let board = [];
    let score = 0;
    let best = parseInt(localStorage.getItem('mano_2048_best') || '0', 10);
    document.getElementById('bestScore').textContent = best;
    let audioCtx = null;

    function playTileSound(val) {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300 + Math.log2(val || 2) * 80, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.06, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch(e) {}
    }

    function initGame() {
      board = Array.from({ length: 4 }, () => Array(4).fill(0));
      score = 0;
      document.getElementById('score').textContent = '0';
      spawnTile();
      spawnTile();
      render();
    }

    function spawnTile() {
      const empty = [];
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          if (board[r][c] === 0) empty.push({ r, c });
        }
      }
      if (empty.length > 0) {
        const { r, c } = empty[Math.floor(Math.random() * empty.length)];
        board[r][c] = Math.random() < 0.9 ? 2 : 4;
      }
    }

    function render() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      for (let r = 0; r < 4; r++) {
        for (let c = 0; c < 4; c++) {
          const val = board[r][c];
          const tile = document.createElement('div');
          tile.className = `tile ${val > 0 ? `tile-${val}` : ''}`;
          tile.textContent = val > 0 ? val : '';
          grid.appendChild(tile);
        }
      }
    }

    function slide(row) {
      let arr = row.filter(val => val !== 0);
      for (let i = 0; i < arr.length - 1; i++) {
        if (arr[i] === arr[i + 1]) {
          arr[i] *= 2;
          score += arr[i];
          playTileSound(arr[i]);
          arr[i + 1] = 0;
          if (score > best) {
            best = score;
            localStorage.setItem('mano_2048_best', best);
            document.getElementById('bestScore').textContent = best;
          }
        }
      }
      document.getElementById('score').textContent = score;
      arr = arr.filter(val => val !== 0);
      while (arr.length < 4) arr.push(0);
      return arr;
    }

    function moveLeft() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const original = [...board[r]];
        board[r] = slide(board[r]);
        if (original.some((v, i) => v !== board[r][i])) moved = true;
      }
      return moved;
    }

    function moveRight() {
      let moved = false;
      for (let r = 0; r < 4; r++) {
        const original = [...board[r]];
        board[r] = slide(board[r].reverse()).reverse();
        if (original.some((v, i) => v !== board[r][i])) moved = true;
      }
      return moved;
    }

    function moveUp() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[0][c], board[1][c], board[2][c], board[3][c]];
        const next = slide(col);
        for (let r = 0; r < 4; r++) {
          if (board[r][c] !== next[r]) moved = true;
          board[r][c] = next[r];
        }
      }
      return moved;
    }

    function moveDown() {
      let moved = false;
      for (let c = 0; c < 4; c++) {
        const col = [board[3][c], board[2][c], board[1][c], board[0][c]];
        const next = slide(col).reverse();
        for (let r = 0; r < 4; r++) {
          if (board[r][c] !== next[r]) moved = true;
          board[r][c] = next[r];
        }
      }
      return moved;
    }

    function handleInput(dir) {
      let moved = false;
      if (dir === 'left') moved = moveLeft();
      else if (dir === 'right') moved = moveRight();
      else if (dir === 'up') moved = moveUp();
      else if (dir === 'down') moved = moveDown();

      if (moved) {
        spawnTile();
        render();
      }
    }

    window.addEventListener('keydown', (e) => {
      if (['ArrowLeft', 'KeyA'].includes(e.code)) { e.preventDefault(); handleInput('left'); }
      else if (['ArrowRight', 'KeyD'].includes(e.code)) { e.preventDefault(); handleInput('right'); }
      else if (['ArrowUp', 'KeyW'].includes(e.code)) { e.preventDefault(); handleInput('up'); }
      else if (['ArrowDown', 'KeyS'].includes(e.code)) { e.preventDefault(); handleInput('down'); }
    });

    // Touch swipe
    let touchStartX = 0, touchStartY = 0;
    window.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    });
    window.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy)) {
        if (Math.abs(dx) > 30) handleInput(dx > 0 ? 'right' : 'left');
      } else {
        if (Math.abs(dy) > 30) handleInput(dy > 0 ? 'down' : 'up');
      }
    });

    initGame();
  </script>
</body>
</html>
