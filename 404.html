<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Laboratory Route Not Found | MANO-LAB</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><circle cx=%2250%22 cy=%2250%22 r=%2238%22 fill=%22%23c8ff00%22/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/styles/main.css">
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 2rem;">

  <div style="max-width: 480px; width: 100%;">
    <div style="display: inline-flex; align-items: center; gap: 0.5rem; margin-bottom: 2rem;">
      <span class="brand-dot" style="width: 10px; height: 10px;"></span>
      <span style="font-weight: 800; font-size: 1.25rem; letter-spacing: -0.03em;">MANO-LAB</span>
    </div>

    <div style="font-family: var(--font-mono); font-size: 5rem; font-weight: 800; color: var(--accent-lime); line-height: 1; margin-bottom: 1rem; letter-spacing: -0.05em;">
      404
    </div>

    <h1 style="font-size: 1.5rem; margin-bottom: 1rem; letter-spacing: -0.02em;">
      Experiment Route Not Found
    </h1>

    <p style="color: var(--text-secondary); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2.25rem;">
      The requested laboratory application, experiment, or resource path does not exist in the MANO-LAB registry.
    </p>

    <div style="display: flex; align-items: center; justify-content: center; gap: 1rem; flex-wrap: wrap;">
      <a href="/" class="btn-primary">
        <i data-lucide="home" style="width: 16px; height: 16px;"></i>
        <span>Return to Laboratory Home</span>
      </a>
      <a href="/apps/audio-transcription/" class="btn-secondary">
        <i data-lucide="mic" style="width: 16px; height: 16px;"></i>
        <span>Audio Transcription</span>
      </a>
    </div>
  </div>

  <script>
    if (window.lucide) {
      window.lucide.createIcons();
    }
  </script>
</body>
</html>
